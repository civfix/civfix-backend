packages:
  - "services/*"
  - "packages/*"

# A dependency that declares it cannot run on our Node must stop the install, not print a warning CI ignores.
engineStrict: true

# pnpm 10's `pnpm deploy` (both Dockerfiles build the runtime tree with it) requires injected workspace
# packages. dedupeInjectedDeps (on by default) keeps them symlinked in the workspace, so local installs
# are unchanged.
injectWorkspacePackages: true

# Supply-chain gates (civfix/issue-tracker#259 D11). A version must be a day old before it can resolve, so a
# hijacked publish is usually caught and pulled first. @civfix/* is exempt: it is our own registry, and a fresh
# contract or tokens publish has to be adoptable the same day. An urgent same-day security fix gets its own
# per-package entry in minimumReleaseAgeExclude; never lower the global age.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@civfix/*"
# Refuse a version published with weaker provenance than the versions before it (a stolen token, not CI).
trustPolicy: no-downgrade
# A git or tarball-URL subdependency carries no publish time or provenance, so it would slip past both checks above.
# Off for now, only because node-apn@3.0.0 takes its http2 from a GitHub archive (node-apn/node-http2#apn-2.1.4,
# patched for the GOAWAY frames APNs sends, so the registry http2 is no substitute). With this on, every
# re-resolution fails on it, and any overrides edit triggers one. The lockfile pins that tarball by integrity.
# Turn this on when node-apn is replaced.
blockExoticSubdeps: false
# A new install script must stop the install for review: skipped silently, it can also break a native binary unnoticed.
strictDepBuilds: true

# The only packages allowed to run install scripts. esbuild (tsup, tsx, vitest) verifies and if needed fetches its
# platform binary; ffmpeg-static downloads the ffmpeg binary the media-worker runs outside its image (dev and
# tests). Skipped on purpose: ssh2 and cpu-features (optional native speedups under testcontainers, which fall back
# to pure JS), protobufjs (a version notice) and @firebase/util (bakes a Firebase web-app config from
# FIREBASE_WEBAPP_CONFIG, which only browser bundles read). Add a package here only after reading its script.
allowBuilds:
  esbuild: true
  ffmpeg-static: true
  "@firebase/util": false
  cpu-features: false
  protobufjs: false
  ssh2: false

# node-apn@3.0.0 (the APNs dispatcher in services/api/src/adapters/push-apns.ts, still live whenever APNS_* is
# configured) is ABANDONED and pins node-forge@0.7.6 (seven advisories including RSA and Ed25519 SIGNATURE
# FORGERY) plus jsonwebtoken@8.5.1, which signs the APNs auth token. Neither is reachable by a range bump because
# node-apn is unmaintained, so we force the patched majors here. Both are API-compatible for node-apn's usage
# (jwt.sign with ES256 + a pem key; forge only for the legacy pkcs12/cert path we never take). Revisit when
# node-apn is replaced or dropped.
#
# The remaining entries force patched versions of transitive packages whose direct parent still declares a
# vulnerable range, each bounded INSIDE the vulnerable package's own major so the fix stays a patch/minor for the
# requester: find-my-way + fast-uri (fastify/ajv, HTTP/2 DDoS + host-confusion/SSRF); brace-expansion 1/2/5,
# js-yaml 4, nanoid 3, postcss, source-map-js 1 (eslint, minimatch, glob, vite, tsup DoS + path-traversal
# advisories; postcss 8.5.28 still declares a vulnerable source-map-js range); vite (vitest's resolution, path
# traversal + fs.deny bypass); protobufjs 7 (grpc/firebase, proto-parse DoS); deepmerge-ts (html-to-text stack
# exhaustion); uuid 9/10 (gaxios, dockerode - missing buffer bounds check); @fastify/busboy 3 and @grpc/grpc-js 1
# (firebase-admin, multipart and HTTP/2 DoS); and the scoped esbuild entries for tsup, tsx, vite and drizzle-kit's
# abandoned @esbuild-kit/core-utils (dev-server arbitrary file read). Drop each entry once its parent ships the
# fixed range itself.
overrides:
  node-forge: "^1.4.0"
  jsonwebtoken: "^9.0.2"
  find-my-way: ">=9.9.0 <10"
  fast-uri: ">=3.1.9 <4"
  websocket-driver@<0.7.5: "^0.7.5"
  form-data@<2.5.6: "^2.5.6"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@2: ">=2.1.6 <3"
  brace-expansion@5: ">=5.0.12 <6"
  js-yaml@4: ">=4.3.2 <5"
  nanoid@3: ">=3.3.18 <4"
  postcss: ">=8.5.28 <9"
  source-map-js@1: ">=1.2.2 <2"
  vite: ">=7.3.6 <8"
  protobufjs@7: ">=7.6.6 <8"
  deepmerge-ts: ">=8.0.2 <9"
  "@fastify/busboy@3": ">=3.2.1 <4"
  "@grpc/grpc-js@1": ">=1.14.5 <2"
  tsup>esbuild: ">=0.28.1 <0.29"
  tsx>esbuild: ">=0.28.1 <0.29"
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0 <0.26"
  uuid@9: ">=11.1.1 <12"
  uuid@10: ">=11.1.1 <12"
  vite>esbuild: ">=0.28.1 <0.29"

auditConfig:
  # GHSA-86w9-cpqp-85rv (node-forge RSA PKCS#1 v1.5 signature verification) has no patched release. node-forge
  # reaches us only through node-apn (see overrides), which uses it to parse our own APNs certificate/key files and
  # never verifies an RSA signature, so the flawed path is unreachable. Remove with node-apn.
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
