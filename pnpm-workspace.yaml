packages:
  - "services/*"
  - "packages/*"

# A dependency that declares it cannot run on our Node must stop the install, not print a warning CI ignores.
engineStrict: true

# pnpm 10's `pnpm deploy` (both Dockerfiles build the runtime tree with it) requires injected workspace
# packages. dedupeInjectedDeps (on by default) keeps them symlinked in the workspace, so local installs
# are unchanged.
injectWorkspacePackages: true

# Supply-chain gates (civfix/issue-tracker#259 D11). A version must be a day old before it can resolve, so a
# hijacked publish is usually caught and pulled first. @civfix/* is exempt: it is our own registry, and a fresh
# contract or tokens publish has to be adoptable the same day. An urgent same-day security fix gets its own
# per-package entry in minimumReleaseAgeExclude; never lower the global age.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@civfix/*"
# Refuse a version published with weaker provenance than the versions before it (a stolen token, not CI).
trustPolicy: no-downgrade
# A git or tarball-URL subdependency carries no publish time or provenance, so it would slip past both checks above.
blockExoticSubdeps: true
# A new install script must stop the install for review: skipped silently, it can also break a native binary unnoticed.
strictDepBuilds: true

# The only packages allowed to run install scripts. esbuild (tsup, tsx, vitest) verifies and if needed fetches its
# platform binary; ffmpeg-static downloads the ffmpeg binary the media-worker runs outside its image (dev and
# tests). Skipped on purpose: ssh2 and cpu-features (optional native speedups under testcontainers, which fall back
# to pure JS), protobufjs (a version notice) and @firebase/util (bakes a Firebase web-app config from
# FIREBASE_WEBAPP_CONFIG, which only browser bundles read). Add a package here only after reading its script.
allowBuilds:
  esbuild: true
  ffmpeg-static: true
  "@firebase/util": false
  cpu-features: false
  protobufjs: false
  ssh2: false

# These force patched versions of transitive packages whose direct parent still declares a vulnerable range, each
# bounded INSIDE the vulnerable package's own major so the fix stays a patch/minor for the requester: find-my-way +
# fast-uri (fastify/ajv, HTTP/2 DDoS + host-confusion/SSRF); brace-expansion 1/2/5, js-yaml 4, nanoid 3, postcss,
# source-map-js 1 (eslint, minimatch, glob, vite, tsup DoS + path-traversal advisories; postcss 8.5.28 still declares
# a vulnerable source-map-js range); vite (vitest's resolution, path traversal + fs.deny bypass); protobufjs 7
# (grpc/firebase, proto-parse DoS); deepmerge-ts (html-to-text stack exhaustion); uuid 9/10 (gaxios, dockerode -
# missing buffer bounds check); @fastify/busboy 3 and @grpc/grpc-js 1 (firebase-admin, multipart and HTTP/2 DoS); and
# the scoped esbuild entries for tsup, tsx, vite and drizzle-kit's abandoned @esbuild-kit/core-utils (dev-server
# arbitrary file read). Drop each entry once its parent ships the fixed range itself.
overrides:
  find-my-way: ">=9.9.0 <10"
  fast-uri: ">=3.1.9 <4"
  websocket-driver@<0.7.5: "^0.7.5"
  form-data@<2.5.6: "^2.5.6"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@2: ">=2.1.6 <3"
  brace-expansion@5: ">=5.0.12 <6"
  js-yaml@4: ">=4.3.2 <5"
  nanoid@3: ">=3.3.18 <4"
  postcss: ">=8.5.28 <9"
  source-map-js@1: ">=1.2.2 <2"
  vite: ">=7.3.6 <8"
  protobufjs@7: ">=7.6.6 <8"
  deepmerge-ts: ">=8.0.2 <9"
  "@fastify/busboy@3": ">=3.2.1 <4"
  "@grpc/grpc-js@1": ">=1.14.5 <2"
  tsup>esbuild: ">=0.28.1 <0.29"
  tsx>esbuild: ">=0.28.1 <0.29"
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0 <0.26"
  uuid@9: ">=11.1.1 <12"
  uuid@10: ">=11.1.1 <12"
  vite>esbuild: ">=0.28.1 <0.29"

# No untrusted input reaches any ignored advisory; each entry says when it can go.
auditConfig:
  ignoreGhsas:
    # minimatch pattern-amplification DoS and glob's AbortSignal cancellation bypass, fixed only in the new majors
    # (minimatch 11.0.1, glob 14.0.2) that no parent accepts yet. In production they arrive only under
    # firebase-admin's firestore (google-gax 5 and gaxios > rimraf), which the API never loads: it imports just
    # firebase-admin/app and firebase-admin/messaging. Everywhere else they are dev tooling (eslint, rimraf clean
    # scripts, testcontainers' archiver) matching patterns written in this repo, and none of it passes an
    # AbortSignal to bound a walk. Remove once the lockfile resolves glob >=14.0.2 and minimatch >=11.0.1 everywhere.
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
