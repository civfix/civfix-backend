name: Weekly audit

# CI only audits when a PR runs, so an advisory published in a quiet week would otherwise go unseen. This
# re-runs the same audit gates on main every Monday and fails visibly; it is not a required check.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Audit all dependencies (high and above)
        run: pnpm audit --audit-level high

      - name: Audit production dependencies (moderate and above)
        run: pnpm audit --prod --audit-level moderate

      - name: Audit the email worker (high and above)
        run: pnpm --dir infra/email-worker audit --audit-level high
