name: Deploy (staging)

# Deploys the civfix backend to the STAGING VPS (193.122.142.107). TWO jobs, in order:
#
#   1. `images`  builds the api + media-worker images for this commit and pushes them to GHCR
#                (build-images.yml). This is the ONLY build of this release — production is later
#                promoted onto these exact digests rather than rebuilding.
#   2. `deploy`  SSHes the box, whose forced command runs /opt/civfix/infra/ops/deploy.sh. That script
#                git-pulls the infra repo (single `main` branch — the same tree prod runs; the box's env
#                marker at /etc/civfix/env selects env/staging.sh and secrets/staging/) + this backend
#                (at CIVFIX_REF, which env/staging.sh defaults to `main`), PULLS the images job 1 just
#                published, SOPS-decrypts the secrets, then blue/green swaps the compose stack.
#
# The build no longer happens on the VPS. Job 1 must therefore SUCCEED before job 2 runs: deploy.sh fails
# closed when no published image exists for the commit, rather than quietly building one.
# Mirrors deploy.yml (prod). Issue: https://github.com/civfix/issue-tracker/issues/108
#
# Triggers:
#   - Every push to main. `main` IS the staging lane — there is no `dev` branch any more; feature
#     branches PR into main, and prod is promoted from a `v*` release cut off main.
#   - Manually via the Actions "Run workflow" button (workflow_dispatch).
# Both deploy the staging env's CIVFIX_REF (from env/staging.sh, default `main`); the SSH forced command
# ignores any client-sent command, so a deploy can never target an arbitrary ref.
#
# !! MERGE ORDER !! The availability assertion below REQUIRES the civfix-infra blue/green deploy
# (two api colors, Caddy active health checks with health_interval 2s / health_timeout 1s, and
# `stop_grace_period: 45s` + SHUTDOWN_DRAIN_MS=8000 on the api service) to be LIVE ON THE BOX ALREADY.
# Against the old stop-then-start deploy the API genuinely goes down for tens of seconds and this job
# fails every time. This backend branch must merge AFTER the civfix-infra change, never alone.
#
# THE AVAILABILITY CHECK IS AN ASSERTION, NOT A "did it come back" WAIT — see the deploy.yml header for
# the reasoning. GET /healthz is polled once a second for the whole deploy (pure and
# rate-limit-allowlisted, so a 1s poll cannot trip the limiter); the job fails when the longest gap
# between serving samples exceeds MAX_OUTAGE_S seconds, with a 503 carrying the x-civfix-draining
# response header (the retiring color, by design) not counted as an outage. /readyz (db + redis, not
# allowlisted) stays a separate gate afterwards, and the availability + deploy-rc assertion runs last:
# both steps are `if: always()`, so a red availability result cannot skip the readiness gate and a
# failed ssh still fails the job. It all runs after the flip, so it reports rather than prevents.
#
# Required repo secret:
#   STAGING_DEPLOY_SSH_KEY  Private half of the dedicated staging CI deploy key (ed25519). Its public half
#                           is the `deployer` user on the staging VPS, whose authorized_keys forces this
#                           key to run ONLY `sudo -n -u civfix -H /opt/civfix/infra/ops/deploy.sh`
#                           (sudoers-scoped). A leaked key can at most trigger a staging deploy of `main`.
#
# The staging VPS IP and its SSH host key are pinned below (neither is secret).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One staging deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # The release artifacts. `deploy` needs this: the box pulls what this job pushed.
  images:
    name: release images
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: ssh deploy + availability assertion
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No checkout: the VPS pulls the code itself; this job only needs to SSH in.
    env:
      DEPLOY_HOST: 193.122.142.107
      DEPLOY_USER: deployer
      LIVENESS_URL: https://api.civfix.dev/healthz
      # Longest public unavailability tolerated during a deploy, in seconds (sub-second resolution;
      # see the SLO SEMANTIC note in the probe step). One isolated failed sample measures ~2s and can
      # never fail the job; this fails from two consecutive failed samples upward.
      MAX_OUTAGE_S: "3.0"
      HEALTH_URL: https://api.civfix.dev/readyz
    steps:
      - name: Configure SSH (deploy key + pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the staging VPS ed25519 host key so a changed/forged host is rejected.
          printf '%s\n' "193.122.142.107 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP843TSCJte6yLyn3qWk1t9Gr5oDecExWJWEgdboX4FU" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy + continuous availability probe (the API must never go down)
        run: |
          set -euo pipefail
          # The probe and the deploy MUST live in the same step: a background process started in one
          # step is not reliably alive in the next. This step only MEASURES; the pass/fail verdict is
          # the last step, so a red availability result can never skip the readiness gate.
          #
          # Each sample is classified into one token and stamped with a SUB-SECOND timestamp, then
          # aggregated by WALL CLOCK (not by sample count): a hung upstream produces ONE line per
          # --max-time, so counting samples would let a 10s hole look like a 1s blip.
          #   200      serving
          #   draining this api color got SIGTERM and is finishing its in-flight work; /healthz is 503
          #            by design so Caddy demotes it (services/api/src/lifecycle.ts). NOT an outage -
          #            every other path is still served 200 by this same process. The marker is the
          #            x-civfix-draining RESPONSE HEADER, never the body: the body is world-readable
          #            to anonymous callers and a drain marker in it is a deploy-timing oracle. The
          #            headers are dumped to a file instead of read with curl's %header{} write-out,
          #            which needs curl >= 7.84. A 503 without the header still counts against us.
          #   <code>   any other HTTP status (502 = Caddy has no healthy upstream: a real outage)
          #   000      connection refused / DNS / timeout
          #
          # SLO SEMANTIC: MAX_OUTAGE_S is the longest tolerated GAP between two serving samples - the
          # wall-clock span of a run of consecutive failed samples, including the hop in and out of
          # it. Resolution is the ~1s sample cadence, so an outage shorter than that can fall between
          # two samples and stay invisible: this asserts "no user-visible hole", not "not one dropped
          # request". A single isolated failed sample that returns promptly measures ~2s and passes;
          # 3.0 fails from two consecutive failures upward, and also from one failure slow enough
          # (>~1s of curl time) that the hole itself is real.
          #
          # COVERAGE IS ASSERTED TOO. A worst-gap of 0.00 is what an EMPTY probe.log prints, so the
          # step also records how long it sampled, how many samples it got, how stale the last one
          # is, and whether the sampler was still alive when it was killed. Without that a sampler
          # that died early would report a perfect score for a deploy it never watched.
          rm -f probe.log probe.headers
          probe_started="$(date -u +%s.%N)"
          # errexit off inside the sampler only: a transient curl/grep non-zero must not kill it.
          ( set +e
            while :; do
              t="$(date -u +%s.%N)"
              code="$(curl -s -m 10 -o /dev/null -D probe.headers -w '%{http_code}' "$LIVENESS_URL" 2>/dev/null)"
              state="$code"
              case "$code" in
                200) state=200 ;;
                503) grep -qi '^x-civfix-draining:' probe.headers && state=draining ;;
                ""|000) state=000 ;;
              esac
              printf '%s %s\n' "$t" "$state" >> probe.log
              sleep 1
            done ) &
          PROBE=$!

          # No remote command is passed: the deploy key's forced command runs deploy.sh (CIVFIX_REF=main).
          # Its stdout/stderr stream here and its exit code becomes `rc`, which the assertion step
          # turns into a job failure. Keepalives keep the connection up during the (quiet) build.
          if ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "${DEPLOY_USER}@${DEPLOY_HOST}"; then
            rc=0
          else
            rc=$?
          fi

          # deploy.sh returns right after the flip; keep probing across the retiring color's drain and
          # the compose reconcile step.
          sleep 30
          if kill -0 "$PROBE" 2>/dev/null; then probe_alive=1; else probe_alive=0; fi
          kill "$PROBE" 2>/dev/null || true
          wait "$PROBE" 2>/dev/null || true
          probe_ended="$(date -u +%s.%N)"

          echo "--- samples that were not serving (empty is perfect) ---"
          awk '$2!="200" && $2!="draining"' probe.log || true
          total="$(awk 'END { print NR + 0 }' probe.log)"
          # Longest UNAVAILABLE interval in seconds: from the last serving sample before a bad run to
          # the first serving sample after it, so one slow --max-time sample cannot hide the hole.
          worst="$(awk '
            { ok = ($2 == "200" || $2 == "draining")
              if (ok) { if (bad) { d = $1 - lastgood; if (d > worst) worst = d; bad = 0 }; lastgood = $1 }
              else    { if (!bad) { bad = 1; if (lastgood == "") lastgood = $1 }; lastbad = $1 } }
            END { if (bad) { d = lastbad - lastgood; if (d > worst) worst = d }; printf "%.2f", worst + 0 }
          ' probe.log)"
          last="$(tail -n 1 probe.log | awk '{ print $2 }')"
          last_at="$(tail -n 1 probe.log | awk '{ printf "%.2f", $1 + 0 }')"
          elapsed="$(awk -v a="$probe_started" -v b="$probe_ended" 'BEGIN { printf "%.0f", b - a }')"
          stale="$(awk -v e="$probe_ended" -v l="$last_at" 'BEGIN { printf "%.2f", e - l }')"
          echo "samples=$total elapsed_s=$elapsed last_sample=$last last_sample_age_s=$stale probe_alive=$probe_alive longest_unavailable_s=$worst slo=${MAX_OUTAGE_S}s deploy_rc=$rc"
          {
            echo "DEPLOY_RC=$rc"
            echo "WORST_UNAVAILABLE_S=$worst"
            echo "LAST_SAMPLE=$last"
            echo "PROBE_SAMPLES=$total"
            echo "PROBE_ELAPSED_S=$elapsed"
            echo "PROBE_LAST_AGE_S=$stale"
            echo "PROBE_ALIVE=$probe_alive"
          } >> "$GITHUB_ENV"

      - name: Readiness gate (db + redis behind the new api color)
        if: success() || failure()
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code="$(curl -fsS -o /tmp/readyz.json -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "ready: $(cat /tmp/readyz.json)"
              exit 0
            fi
            echo "attempt $i: readyz=$code; retrying in 10s"
            sleep 10
          done
          echo "FATAL: $HEALTH_URL did not return 200 within ~3m after deploy" >&2
          exit 1

      - name: Availability assertion (deploy rc + probe coverage + the API never went down)
        if: success() || failure()
        run: |
          set -euo pipefail
          rc="${DEPLOY_RC:-1}"
          worst="${WORST_UNAVAILABLE_S:-}"
          last="${LAST_SAMPLE:-}"
          samples="${PROBE_SAMPLES:-0}"
          elapsed="${PROBE_ELAPSED_S:-0}"
          age="${PROBE_LAST_AGE_S:-999}"
          alive="${PROBE_ALIVE:-0}"
          [ "$rc" -eq 0 ] || { echo "FATAL: on-box deploy failed (rc=$rc)" >&2; exit 1; }
          # Coverage first: a verdict from a probe that stopped sampling is worthless, and an empty
          # probe.log scores a perfect 0.00.
          [ -n "$worst" ] || { echo "FATAL: the availability probe recorded no verdict" >&2; exit 1; }
          [ "$alive" -eq 1 ] || { echo "FATAL: the availability probe died before the deploy finished" >&2; exit 1; }
          [ "$elapsed" -gt 0 ] || { echo "FATAL: the availability probe measured no time" >&2; exit 1; }
          # At a ~1s cadence with 10s worst-case stalls, fewer than one sample per 3s of deploy means
          # the sampler was not watching.
          awk -v s="$samples" -v e="$elapsed" 'BEGIN { exit !(s >= e / 3) }' || {
            echo "FATAL: availability probe coverage too thin: $samples samples over ${elapsed}s" >&2
            exit 1; }
          awk -v a="$age" 'BEGIN { exit !(a <= 5) }' || {
            echo "FATAL: the last availability sample is ${age}s old; the probe stopped early" >&2
            exit 1; }
          awk -v w="$worst" -v m="$MAX_OUTAGE_S" 'BEGIN { exit !(w <= m) }' || {
            echo "FATAL: public API was unavailable for ~${worst}s during the deploy (slo ${MAX_OUTAGE_S}s)" >&2
            exit 1; }
          case "$last" in
            200|draining) ;;
            *) echo "FATAL: API is not serving at the end of the deploy (last sample: ${last:-none})" >&2; exit 1 ;;
          esac
          echo "availability OK: $samples samples over ${elapsed}s, longest unavailable ${worst}s <= ${MAX_OUTAGE_S}s"

      - name: Cleanup deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
