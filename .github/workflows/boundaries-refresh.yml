name: Boundaries refresh (publish to R2)

# The "prep" half of the automated jurisdiction-boundary pipeline (the on-box half is the
# "jurisdiction.refresh" pg-boss cron in services/api/src/services/admin/boundary-refresh-jobs.ts).
#
# What it does: probe the latest Census TIGER vintage, download the public-domain sources (TIGER
# state/county/place + Census AIANNH tribal + best-effort USGS PAD-US federal), convert them to
# reprojected (EPSG:4326) GeoJSON with `ogr2ogr`, gzip each layer, and publish a vintage-tagged bundle
# to R2 (boundaries/<tag>/*.geojson.gz + manifest.json), flipping boundaries/current.json LAST. The
# on-box cron then loads whatever current.json points at and backfills NULL reports. GDAL lives ONLY on
# this runner — never in the API runtime image.
#
# Why CI (not the box): the download + ogr2ogr convert is heavy, GDAL-dependent, annual, and code-
# independent; the only half that MUST run on the box is the DB write (prod Postgres is not reachable
# from CI). R2 is the hand-off. The convert only runs when a NEW vintage is detected (the tag is the
# idempotency key), so the monthly schedule is a cheap probe 11 months a year.
#
# REQUIRED repo config (set once; the workflow fails loudly until present):
#   secrets.R2_ACCOUNT_ID          Cloudflare R2 account id (the S3 endpoint host).
#   secrets.R2_BOUNDARIES_KEY_ID   R2 S3 access key id, scoped to the boundaries bucket (Object R/W).
#   secrets.R2_BOUNDARIES_SECRET   R2 S3 secret access key for that token.
#   vars.R2_BOUNDARIES_BUCKET      The R2 bucket name (must match the backend's R2_BOUNDARIES_BUCKET,
#                                  or R2_BUCKET if that is unset on the box).

on:
  schedule:
    # 1st of each month, 08:00 UTC. Cheap (a few HEADs) unless a new vintage is out, when it converts.
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      vintage:
        description: "TIGER vintage year (blank = auto-detect latest)"
        required: false
        default: ""
      force:
        description: "Re-publish even if the tag already exists in R2 (true/false)"
        required: false
        default: "false"

# Never run two publishes at once (they race boundaries/current.json).
concurrency:
  group: boundaries-refresh
  cancel-in-progress: false

jobs:
  publish:
    name: convert + publish boundary bundle
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BOUNDARIES_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BOUNDARIES_SECRET }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the aws-cli v2 default trailing integrity checksums; only sign them when required
      # (mirrors the requestChecksumCalculation: "WHEN_REQUIRED" the R2Storage adapter sets).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: ${{ vars.R2_BOUNDARIES_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install GDAL (ogr2ogr)
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Free up runner disk space
        # The PAD-US national GDB is ~1.5 GB zipped / ~8-10 GB unzipped, plus the nationwide GeoJSON
        # outputs — the default ~14 GB free on / is tight. Reclaim ~20 GB by dropping toolchains we don't
        # use (NOT the hostedtoolcache/node dir, which is on PATH).
        run: |
          set -uo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - name: Install dependencies (tsx + manifest)
        run: pnpm install --frozen-lockfile

      - name: Resolve TIGER vintage + bundle tag
        id: vintage
        working-directory: services/api
        env:
          # Pass the dispatch input through env (never interpolate untrusted input into the shell body).
          INPUT_VINTAGE: ${{ github.event.inputs.vintage }}
        run: |
          set -euo pipefail
          YEAR="$INPUT_VINTAGE"
          if [ -z "$YEAR" ]; then
            # Newest TIGER<Y> whose national STATE zip exists, walking back from next calendar year. This
            # auto-advances each fall when Census publishes the new vintage — no code change needed.
            CUR=$(date -u +%Y)
            for Y in $((CUR + 1)) "$CUR" $((CUR - 1)) $((CUR - 2)); do
              if curl -fsI "https://www2.census.gov/geo/tiger/TIGER${Y}/STATE/tl_${Y}_us_state.zip" >/dev/null 2>&1; then
                YEAR="$Y"; break
              fi
            done
          fi
          # Validate to exactly 4 digits BEFORE it becomes a step output, so every downstream
          # interpolation of steps.vintage.outputs.year/tag is a safe, fixed-shape string.
          if ! printf '%s' "$YEAR" | grep -Eq '^[0-9]{4}$'; then
            echo "::error::could not resolve a valid 4-digit TIGER vintage (got '$YEAR')"; exit 1
          fi
          TAG="$(pnpm -s db:prepare-boundaries --print-tag "$YEAR")"
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved TIGER vintage $YEAR -> bundle tag $TAG"

      - name: Skip if this bundle is already published
        id: skip
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "$INPUT_FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if aws s3api head-object --endpoint-url "$R2_S3_ENDPOINT" \
               --bucket "$BUCKET" --key "boundaries/${{ steps.vintage.outputs.tag }}/manifest.json" >/dev/null 2>&1; then
            echo "Bundle ${{ steps.vintage.outputs.tag }} already in R2 — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download sources
        if: steps.skip.outputs.skip == 'false'
        working-directory: services/api
        env:
          YEAR: ${{ steps.vintage.outputs.year }}
        run: |
          # GitHub's default shell is `bash -eo pipefail`; turn errexit OFF here because we control
          # success/failure PER SOURCE (census = hard fail via `fail=1; break`; PAD-US = best-effort) and
          # rely on capturing `$?` after unzip (exit 1 == benign warning). Keep -u + pipefail.
          set -uo pipefail
          set +e
          mkdir -p out/sources
          # The manifest is the single source of the URL list (50-state PLACE + national layers). Census
          # sources are REQUIRED (a missing one = partial coverage we must not ship); the non-census source
          # (PAD-US federal) is BEST-EFFORT (additive — a hiccup must not block the TIGER+AIANNH bundle).
          pnpm -s db:prepare-boundaries --list-sources "$YEAR" > /tmp/urls.txt
          fail=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            zip=/tmp/src.zip
            case "$url" in
              *www2.census.gov*)
                echo "downloading (required) $url"
                if ! curl -fsSL "$url" -o "$zip"; then echo "::error::required download failed: $url"; fail=1; break; fi
                # unzip exit 1 == benign warning (e.g. extra bytes) with extraction OK; only >1 is fatal.
                unzip -o -q "$zip" -d out/sources/; uz=$?
                if [ "$uz" -gt 1 ]; then echo "::error::required unzip failed ($uz): $url"; fail=1; break; fi ;;
              *)
                echo "downloading (best-effort) $url"
                if curl -fsSL "$url" -o "$zip"; then
                  unzip -o -q "$zip" -d out/sources/; uz=$?
                  if [ "$uz" -gt 1 ]; then echo "::warning::best-effort unzip failed ($uz): $url — federal omitted"; fi
                else
                  echo "::warning::best-effort download failed: $url — federal omitted"
                fi ;;
            esac
            rm -f "$zip"   # free the (up to ~1.5 GB) archive before the next source
          done < /tmp/urls.txt
          [ "$fail" -eq 0 ] || exit 1

      - name: Convert + gzip + write manifest
        if: steps.skip.outputs.skip == 'false'
        working-directory: services/api
        env:
          YEAR: ${{ steps.vintage.outputs.year }}
        run: pnpm db:prepare-boundaries "$YEAR" out

      - name: Publish bundle to R2
        if: steps.skip.outputs.skip == 'false'
        working-directory: services/api
        run: |
          set -euo pipefail
          [ -n "$BUCKET" ] || { echo "::error::vars.R2_BOUNDARIES_BUCKET is not set"; exit 1; }
          # The ACTUAL tag is whatever prepare-boundaries wrote into the manifest — the full tag when
          # federal converted, else "<tag>-nofed" (self-healing: a later federal-complete run lands under
          # the full tag, which the on-box cron sees as a new vintage and reloads).
          TAG="$(jq -r '.vintageTag' out/manifest.json)"
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::manifest.json missing vintageTag"; exit 1; }
          # Upload the gzipped layers + the manifest under the vintage prefix.
          aws s3 cp out/ "s3://$BUCKET/boundaries/$TAG/" --endpoint-url "$R2_S3_ENDPOINT" \
            --recursive --exclude "*" --include "*.geojson.gz" --include "manifest.json"
          # Flip the atomic pointer LAST: the on-box cron only ever acts on a fully-uploaded bundle.
          printf '{"vintageTag":"%s"}\n' "$TAG" > out/current.json
          aws s3 cp out/current.json "s3://$BUCKET/boundaries/current.json" --endpoint-url "$R2_S3_ENDPOINT"
          echo "Published boundaries/$TAG and flipped current.json"
