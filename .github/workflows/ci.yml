name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stage 0.7 (UI-unification) backend-isolation guard: fail CI if the backend ever pulls in
      # frontend runtime deps (react / react-dom / react-native / react-native-web / @civfix/ui).
      # The backend depends ONLY on the framework-free @civfix/shared contract; this keeps it that way.
      - name: Assert backend stays React/RN-free
        run: node scripts/assert-no-frontend.mjs

      # H13 gate: fail the PR on a HIGH/CRITICAL advisory in the PRODUCTION dependency tree. `--prod`
      # deliberately ignores dev-only tooling (a DoS in a test runner is not a production exposure).
      # When a finding has no upstream fix yet, add a `pnpm.overrides` entry in the root package.json
      # (with a comment explaining why the forced version is safe) rather than removing this step.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (unit)
        run: pnpm test

  integration:
    name: integration (postgis + redis)
    runs-on: ubuntu-latest
    # Integration tests that require Docker-backed services run here. They are populated by later
    # steps; for now this job installs, builds, and is ready to run them against live containers.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civfix
          POSTGRES_PASSWORD: civfix
          POSTGRES_DB: civfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civfix -d civfix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://civfix:civfix@localhost:5432/civfix
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Later steps add integration test scripts; this is the hook for them. Kept as a no-op-safe
      # placeholder so the job is green until those tests exist.
      - name: Integration tests
        run: echo "integration tests are added by later steps; services are up at DATABASE_URL / REDIS_URL"
