name: CI

# main is the only long-lived branch (issue civfix/issue-tracker#108): main is the staging lane, and
# production ships from a published v* release. Every PR runs it whatever its base: a stacked PR
# targets its parent slice's branch, and the agents rely on this run as the full check of each slice
# they push.
on:
  pull_request:
  # main's merge queue waits for the required checks on its own gh-readonly-queue/* commit; without this
  # trigger they never report there and every queued PR times out.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend depends ONLY on the framework-free @civfix/contract and @civfix/tokens; fail if it ever pulls in
      # frontend runtime deps (react / react-dom / react-native / react-native-web / @civfix/ui).
      - name: Assert backend stays React/RN-free
        run: node scripts/assert-no-frontend.mjs

      # Dev tooling runs here next to the job's token, so a high advisory anywhere fails the PR, and a
      # moderate one does in the production tree. A finding with no upstream fix gets an `overrides`
      # floor, or an `auditConfig.ignoreGhsas` entry documented in pnpm-workspace.yaml, never a
      # weaker gate.
      - name: Audit all dependencies (high and above)
        run: pnpm audit --audit-level high

      - name: Audit production dependencies (moderate and above)
        run: pnpm audit --prod --audit-level moderate

      - name: Production dependency licenses
        run: pnpm check:licenses

      - name: Test repo scripts
        run: pnpm test:scripts

      - name: Workflow security (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          persona: regular
          min-severity: medium
          online-audits: false
          advanced-security: false

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Dynamic-SQL guard
        run: pnpm check:sql

      # The email worker is not a workspace package: it deploys with wrangler from its own lockfile and
      # its own pnpm-workspace.yaml (settings only), so it installs in isolation. knip below analyzes
      # it too, so this install comes first.
      - name: Email worker install
        run: pnpm --dir infra/email-worker install --frozen-lockfile

      # Its own lockfile, which the root audit above never reads.
      - name: Email worker audit
        run: pnpm --dir infra/email-worker audit --audit-level high

      - name: Email worker typecheck
        run: pnpm --dir infra/email-worker typecheck

      - name: Email worker test (coverage thresholds)
        run: pnpm --dir infra/email-worker test:coverage

      - name: Unused files, exports and dependencies (knip)
        run: pnpm knip

      - name: Duplication (jscpd)
        run: pnpm dup:check

      - name: Build
        run: pnpm build

  # The API suite is most of the wait, and each runner adds 4 free cores. Three shards keep each below
  # the static job's own runtime.
  api-tests:
    name: api tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CIVFIX_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test (unit + integration)
        run: >-
          pnpm --filter @civfix/api exec vitest run --shard="$CIVFIX_TEST_SHARD/3" --coverage
          --reporter=default --reporter=blob --outputFile.blob="$RUNNER_TEMP/api-reports/shard-$CIVFIX_TEST_SHARD.json"

      - name: Upload the shard's report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/api-reports/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # Coverage counts unit and integration together, so the thresholds apply to the combined report: no
  # single shard could meet them.
  api-coverage:
    name: api coverage thresholds
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: api-report-*
          path: ${{ runner.temp }}/api-reports
          merge-multiple: true

      - name: Merge the reports and check the thresholds
        run: pnpm --filter @civfix/api exec vitest run --merge-reports="$RUNNER_TEMP/api-reports" --coverage --reporter=dot

  other-tests:
    name: other package tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The city-filer tests (services/city-filer) drive a real Chromium. This is the same
      # playwright-core the kit and @playwright/mcp pin (epic civfix/issue-tracker#164 D9): change the three together.
      - name: Install Playwright Chromium
        run: |
          sudo mkdir -p /ms-playwright
          sudo chown "$(id -u):$(id -g)" /ms-playwright
          npx --yes playwright-core@1.64.0-alpha-1790635538000 install --with-deps chromium

      # Thresholds are per package, and each of these runs whole, so turbo checks them here.
      - name: Test (unit + integration, coverage thresholds)
        run: pnpm turbo run test:coverage --continue --filter='!@civfix/api'

  # The ruleset requires this name, so the split jobs stay invisible to the merge queue. A check GitHub
  # sees as skipped counts as passed, hence always() and the explicit test of every result.
  required:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    if: always()
    needs: [static, api-tests, api-coverage, other-tests]
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a required CI job finished as $result: $RESULTS"
              exit 1
            fi
          done

  media-worker-sandbox:
    name: media-worker image sandbox smoke
    timeout-minutes: 30
    # Proves the decoder-sandbox contract on every build instead of at deploy time: the image's
    # entrypoint must be able to drop root -> node while keeping ambient CAP_SETUID/CAP_SETGID under the
    # PRODUCTION capability set (cap_drop ALL + cap_add SETUID,SETGID + no-new-privileges), and the
    # worker's preflight must then prove that a child spawned through setpriv has the sandbox uid and NO
    # capabilities, and that the image and video lanes actually run. None of this is reachable from a unit test.
    # Runs on arm64 like the boxes, which also lets it reuse main's release layers from build-images.yml
    # instead of compiling ffmpeg each time. Read-only: nothing a PR builds reaches that cache.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the media-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/media-worker/Dockerfile
          platforms: linux/arm64
          tags: civfix/media-worker:ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=media-worker

      # The same gate build-images.yml holds the release images to, so a fixable HIGH or CRITICAL in the
      # base image or the worker's dependencies fails the PR rather than the post-merge release build.
      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      - name: Scan the media-worker image (fixable HIGH and CRITICAL)
        run: trivy image civfix/media-worker:ci

      - name: Sandbox preflight under the production capability set
        run: |
          set -uo pipefail
          # tee, not command substitution: under `set -e` a failing substitution aborts the step before
          # the echo, hiding the one line that says WHY the sandbox refused to boot.
          docker run --rm \
            --cap-drop ALL \
            --cap-add SETUID \
            --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:mode=1777,noexec,nosuid,nodev \
            -e NODE_ENV=production \
            -e MEDIA_SANDBOX_UID=1001 \
            -e MEDIA_SANDBOX_GID=1001 \
            civfix/media-worker:ci node --enable-source-maps dist/preflight-only.js 2>&1 | tee preflight.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "media-worker sandbox preflight exited $status"
            exit "$status"
          fi
          grep -q "sandbox preflight ok" preflight.log
