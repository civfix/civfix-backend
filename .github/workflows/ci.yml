name: CI

# main is the only long-lived branch (issue civfix/issue-tracker#108): main is the staging lane, and
# production ships from a published v* release. Every PR runs it whatever its base: a stacked PR
# targets its parent slice's branch, and the agents rely on this run as the full check of each slice
# they push.
on:
  pull_request:
  # main's merge queue waits for the required checks on its own gh-readonly-queue/* commit; without this
  # trigger they never report there and every queued PR times out.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The city-filer tests (services/city-filer) drive a real Chromium. This is the same
      # playwright-core the kit and @playwright/mcp pin (epic civfix/issue-tracker#164 D9): change the three together.
      - name: Install Playwright Chromium
        run: |
          sudo mkdir -p /ms-playwright
          sudo chown "$(id -u):$(id -g)" /ms-playwright
          npx --yes playwright-core@1.64.0-alpha-1790635538000 install --with-deps chromium

      # The backend depends ONLY on the framework-free @civfix/contract and @civfix/tokens; fail if it ever pulls in
      # frontend runtime deps (react / react-dom / react-native / react-native-web / @civfix/ui).
      - name: Assert backend stays React/RN-free
        run: node scripts/assert-no-frontend.mjs

      # Fail the PR on a HIGH/CRITICAL advisory in the PRODUCTION dependency tree. `--prod`
      # deliberately ignores dev-only tooling (a DoS in a test runner is not a production exposure).
      # When a finding has no upstream fix yet, add a `pnpm.overrides` entry in the root package.json
      # (with a comment explaining why the forced version is safe) rather than removing this step.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Dynamic-SQL guard
        run: pnpm check:sql

      # The email worker is not a workspace package: it deploys with wrangler from its own lockfile, so
      # it installs in isolation. knip below analyzes it too, so this install comes first.
      - name: Email worker install
        run: pnpm --dir infra/email-worker install --frozen-lockfile --ignore-workspace

      - name: Email worker typecheck
        run: pnpm --dir infra/email-worker typecheck

      - name: Email worker test
        run: pnpm --dir infra/email-worker test

      - name: Unused files, exports and dependencies (knip)
        run: pnpm knip

      - name: Duplication (jscpd)
        run: pnpm dup:check

      - name: Build
        run: pnpm build

      - name: Test (unit)
        run: pnpm test

  media-worker-sandbox:
    name: media-worker image sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Proves the decoder-sandbox contract on every build instead of at deploy time: the image's
    # entrypoint must be able to drop root -> node while keeping ambient CAP_SETUID/CAP_SETGID under the
    # PRODUCTION capability set (cap_drop ALL + cap_add SETUID,SETGID + no-new-privileges), and the
    # worker's preflight must then prove that a child spawned through setpriv has the sandbox uid and NO
    # capabilities, and that the image and video lanes actually run. None of this is reachable from a unit test.
    # Independent of every other job: nothing else here needs Docker.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the media-worker image
        run: docker build -f services/media-worker/Dockerfile -t civfix/media-worker:ci .

      - name: Sandbox preflight under the production capability set
        run: |
          set -uo pipefail
          # tee, not command substitution: under `set -e` a failing substitution aborts the step before
          # the echo, hiding the one line that says WHY the sandbox refused to boot.
          docker run --rm \
            --cap-drop ALL \
            --cap-add SETUID \
            --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:mode=1777,noexec,nosuid,nodev \
            -e NODE_ENV=production \
            -e MEDIA_SANDBOX_UID=1001 \
            -e MEDIA_SANDBOX_GID=1001 \
            civfix/media-worker:ci node dist/preflight-only.js 2>&1 | tee preflight.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "media-worker sandbox preflight exited $status"
            exit "$status"
          fi
          grep -q "sandbox preflight ok" preflight.log
