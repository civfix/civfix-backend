name: CI

# main is the only long-lived branch and the only PR target (issue civfix/issue-tracker#108): main is
# the staging lane, and production ships from a published v* release.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend depends ONLY on the framework-free @civfix/shared contract; fail if it ever pulls in
      # frontend runtime deps (react / react-dom / react-native / react-native-web / @civfix/ui).
      - name: Assert backend stays React/RN-free
        run: node scripts/assert-no-frontend.mjs

      # Fail the PR on a HIGH/CRITICAL advisory in the PRODUCTION dependency tree. `--prod`
      # deliberately ignores dev-only tooling (a DoS in a test runner is not a production exposure).
      # When a finding has no upstream fix yet, add a `pnpm.overrides` entry in the root package.json
      # (with a comment explaining why the forced version is safe) rather than removing this step.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (unit)
        run: pnpm test

  integration:
    name: integration (postgis + redis)
    runs-on: ubuntu-latest
    # Placeholder: the Docker-backed integration suite runs inside the build job's `pnpm test`
    # (testcontainers). This job stays because its name is a required status check on main.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civfix
          POSTGRES_PASSWORD: civfix
          POSTGRES_DB: civfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civfix -d civfix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://civfix:civfix@localhost:5432/civfix
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: echo "integration tests are added by later steps; services are up at DATABASE_URL / REDIS_URL"

  media-worker-sandbox:
    name: media-worker image sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Proves the decoder-sandbox contract on every build instead of at deploy time: the image's
    # entrypoint must be able to drop root -> node while keeping ambient CAP_SETUID/CAP_SETGID under the
    # PRODUCTION capability set (cap_drop ALL + cap_add SETUID,SETGID + no-new-privileges), and the
    # worker's preflight must then prove that a child spawned through setpriv has the sandbox uid and NO
    # capabilities, and that the image lane actually runs. None of this is reachable from a unit test.
    # Independent of every other job: nothing else here needs Docker.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the media-worker image
        run: docker build -f services/media-worker/Dockerfile -t civfix/media-worker:ci .

      - name: Sandbox preflight under the production capability set
        run: |
          set -uo pipefail
          # tee, not command substitution: under `set -e` a failing substitution aborts the step before
          # the echo, hiding the one line that says WHY the sandbox refused to boot.
          docker run --rm \
            --cap-drop ALL \
            --cap-add SETUID \
            --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:mode=1777,noexec,nosuid,nodev \
            -e NODE_ENV=production \
            -e MEDIA_SANDBOX_UID=1001 \
            -e MEDIA_SANDBOX_GID=1001 \
            civfix/media-worker:ci node dist/preflight-only.js 2>&1 | tee preflight.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "media-worker sandbox preflight exited $status"
            exit "$status"
          fi
          grep -q "sandbox preflight ok" preflight.log
