name: Deploy (production)

# Deploys the civfix backend to the production VPS by SSHing in and running the on-box deploy script
# (/opt/civfix/ops/deploy.sh, a shim that execs /opt/civfix/infra/ops/deploy.sh). That script git-pulls
# the infra repo (single `main` branch; the box's env marker at /etc/civfix/env selects env/prod.sh and
# secrets/prod/) + this backend (origin/main), SOPS-decrypts the secrets, then rebuilds and blue/green
# swaps the docker compose stack. The build happens ON the VPS (4-vCPU arm64 box); this workflow only
# triggers it and then proves the public API stayed up.
#
# PRODUCTION IS PROMOTED, NOT BUILT. A merge to main deploys STAGING (deploy-staging.yml) and publishes
# the release images; this workflow takes those exact digests and puts them in front of production.
# Nothing is compiled here. Issue: https://github.com/civfix/issue-tracker/issues/108
#
# Triggers:
#   - A PUBLISHED GitHub release whose tag matches `v*`. Cutting a release IS the production deploy.
#   - Manually via the Actions "Run workflow" button (workflow_dispatch), which re-deploys the current
#     newest release — the recovery path when a deploy failed after the release was already published.
# Neither carries a ref: the SSH forced command discards any client-sent command, and the on-box
# deploy.sh resolves env/prod.sh's CIVFIX_REF=@latest-release to the highest `v*` tag MERGED INTO
# origin/main. Production therefore cannot run code that did not go through the staging lane.
#
# BECAUSE THE BOX RESOLVES "NEWEST RELEASE" ITSELF, the promote job below refuses to run when the tag
# being released is not the newest one. Publishing a release for an older tag would otherwise deploy the
# NEWER code while reporting success against the older tag — a silent wrong-deploy, and exactly the shape
# a panicked "re-release the last good version" rollback takes. Roll back on the box instead:
#   sudo -u civfix CIVFIX_REF=<tag|sha> /opt/civfix/infra/ops/deploy.sh
# or, for a bad-but-healthy release, ops/rollback.sh (~10s, flips back to the retired color).
#
# !! MERGE ORDER !! The availability assertion below REQUIRES the civfix-infra blue/green deploy
# (two api colors, Caddy active health checks with health_interval 2s / health_timeout 1s, and
# `stop_grace_period: 45s` + SHUTDOWN_DRAIN_MS=8000 on the api service) to be LIVE ON THE BOX ALREADY.
# Against the old stop-then-start deploy the API genuinely goes down for tens of seconds and this job
# fails every time. This backend branch must merge AFTER the civfix-infra change, never alone.
#
# THE AVAILABILITY CHECK IS AN ASSERTION, NOT A "did it come back" WAIT. Deploys are blue/green: the
# new api color is started and proved ready BEFORE the old one is stopped, and the app drains on
# SIGTERM (SHUTDOWN_DRAIN_MS) so in-flight requests finish. The contract is therefore "the public API
# never stopped answering", so this job polls GET /healthz once a second FOR THE WHOLE DURATION of the
# deploy and fails when the longest gap between serving samples exceeds MAX_OUTAGE_S. /healthz (not
# /readyz) is the probe: it is pure and rate-limit-allowlisted (services/api/src/plugins/rate-limit.ts),
# so a 1s poll cannot trip the limiter and invent a failure, while still traversing Cloudflare ->
# tunnel -> Caddy -> the live api color, so a Caddy "no healthy upstream" 502 shows up immediately. A
# 503 carrying the x-civfix-draining RESPONSE HEADER is the RETIRING color answering by design and is
# not counted as an outage (it keeps serving every other path); the marker is a header, not a body
# field, so the public body stays a bare {ok:false} with no deploy-timing oracle in it. /readyz
# (db + redis) stays a separate gate after the deploy: it is NOT allowlisted and its verdict is
# memoized 5s server-side.
#
# STEP ORDER IS LOAD-BEARING: the probe step only measures and records; the readiness gate runs next
# with `if: always()`; the availability + deploy-rc assertion runs LAST, also `if: always()`. A red
# availability result therefore can never skip /readyz, and a failed ssh still fails the job.
#
# It all runs AFTER the flip, so it cannot prevent a bad deploy — it fails the job loudly. Rolling back
# is still `CIVFIX_REF=<sha>` on the box (or `docker compose start api-<previous color>`).
#
# Required repo secret:
#   DEPLOY_SSH_KEY  Private half of the dedicated CI deploy key (ed25519). Its public half is the
#                   `deployer` user on the VPS, whose authorized_keys forces this key to run ONLY
#                   `sudo -n -u civfix -H /opt/civfix/ops/deploy.sh` (sudoers-scoped to that one
#                   command). A leaked key can at most trigger a deploy of origin/main — never a
#                   shell, other commands, or root.
#
# The VPS origin IP and its SSH host key are pinned in the job below (neither is secret; SSH 22 is
# firewalled to key-only/no-root and ingress 80/443 is Cloudflare-only).

on:
  release:
    # `released`, NOT `published`: `published` also fires for a PRERELEASE, so cutting v1.3.0-rc.1 to
    # rehearse would deploy production. The regex guard below is the second, independent line of defence.
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; never cancel an in-flight deploy. Scoped to the whole run here, unlike
# the staging workflow: nothing in this run BUILDS anything (promote only re-tags existing digests), so
# queuing a run cannot starve a job another run is waiting on.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Everything that can refuse the deploy happens HERE, before a single byte moves on the box.
  promote:
    name: verify + promote the release images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release, and prove it is the one the box will deploy
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # --force so a moved tag is picked up rather than silently kept at its old commit; the
          # explicit refspec because a release event checks out the TAG, leaving no origin/main to
          # compare against.
          git fetch --quiet --force --tags origin '+refs/heads/main:refs/remotes/origin/main'

          # THE SAME SELECTION THE BOX MAKES — civfix-infra env/prod.sh CIVFIX_RELEASE_TAG_REGEX and
          # ops/deploy.sh. Keep this regex byte-identical to that one: the box resolves the release
          # independently, so if the two rules disagree this job blesses one commit and the box deploys
          # another.
          #
          # git sorts the whole `v*` set and the grep filters afterwards; that is sound because
          # filtering preserves relative order, so the first surviving line is still the highest. The
          # regex is what excludes prereleases — git's -v:refname ranks `v2.0.0-beta.1` ABOVE `v2.0.0`,
          # the opposite of semver. The glob alone is not a release rule either: `v*` also matches
          # `vtest` and `v1.2`, which would outrank every real release and wedge this job permanently.
          RELEASE_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          # `|| true`: under `set -euo pipefail` a grep that matches nothing exits 1 and errexit kills
          # the step AT THIS ASSIGNMENT, making the ::error:: annotation below unreachable — the job
          # would fail with a bare exit code and no explanation. The guard reports it instead.
          newest="$(git tag --list 'v*' --sort=-v:refname --merged origin/main | grep -E "$RELEASE_RE" | head -n 1)" || true
          [ -n "$newest" ] || { echo "::error::no release tag matching $RELEASE_RE is merged into origin/main." >&2; exit 1; }

          tag="${EVENT_TAG:-$newest}"

          if ! printf '%s' "$tag" | grep -qE "$RELEASE_RE"; then
            echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH release tag; refusing to deploy production." >&2
            echo "::error::Prereleases are excluded by design — they never reach prod." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "::error::tag '$tag' is not merged into main. Production only runs code that went through" >&2
            echo "::error::the staging lane. Merge it to main first." >&2
            exit 1
          fi

          if [ "$tag" != "$newest" ]; then
            echo "::error::'$tag' is not the newest release ('$newest' is), and the box always deploys the" >&2
            echo "::error::newest. Running this would deploy $newest while reporting $tag. To put an older" >&2
            echo "::error::release back in production, do it on the box:" >&2
            echo "::error::  sudo -u civfix CIVFIX_REF=$tag /opt/civfix/infra/ops/deploy.sh" >&2
            exit 1
          fi

          sha="$(git rev-list -n 1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploying $tag ($sha)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the staging images to this release
        # NO REBUILD, BY DESIGN. `imagetools create` adds a tag to a manifest that already exists in the
        # registry — a registry-side operation, no pull, no push of layers — so the bytes production runs
        # are provably the bytes staging exercised. A missing image means this commit never completed a
        # staging build, and the deploy is refused here rather than half-way through on the box.
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Promoting \`$TAG\` to production"
            echo
            echo "| image | digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for image in api media-worker; do
            src="ghcr.io/civfix/$image:sha-$SHA"
            if ! digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$src" 2>/dev/null)"; then
              echo "::error::no published image $src." >&2
              echo "::error::Commit $SHA never finished a staging build, so there is nothing to promote." >&2
              echo "::error::Check the 'Deploy (staging)' run for that commit." >&2
              exit 1
            fi
            echo "$image: $digest"
            # `:$TAG` is the durable, immutable record of this release. `:prod` is a MOVING tag and is
            # for humans reading the package list only — nothing consumes it: the box pulls
            # `sha-<40>` and immediately re-pins to the digest (civfix-infra/ops/deploy.sh). Never make
            # anything depend on `:prod`.
            docker buildx imagetools create \
              --tag "ghcr.io/civfix/$image:$TAG" \
              --tag "ghcr.io/civfix/$image:prod" \
              "ghcr.io/civfix/$image@$digest"
            echo "| \`ghcr.io/civfix/$image\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    name: ssh deploy + availability assertion
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No checkout: the VPS pulls the code itself; this job only needs to SSH in.
    env:
      DEPLOY_HOST: 150.136.102.127
      DEPLOY_USER: deployer
      LIVENESS_URL: https://api.civfix.org/healthz
      # Longest public unavailability tolerated during a deploy, in seconds (sub-second resolution;
      # see the SLO SEMANTIC note in the probe step). One isolated failed sample measures ~2s and can
      # never fail the job; this fails from two consecutive failed samples upward.
      MAX_OUTAGE_S: "3.0"
      HEALTH_URL: https://api.civfix.org/readyz
    steps:
      - name: Configure SSH (deploy key + pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the VPS ed25519 host key so a changed/forged host is rejected.
          printf '%s\n' "150.136.102.127 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPnwBwOwSYiKv4aVjHxqXPGgETs1RytxrDNGRVEIzMaa" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy + continuous availability probe (the API must never go down)
        run: |
          set -euo pipefail
          # The probe and the deploy MUST live in the same step: a background process started in one
          # step is not reliably alive in the next. This step only MEASURES; the pass/fail verdict is
          # the last step, so a red availability result can never skip the readiness gate.
          #
          # Each sample is classified into one token and stamped with a SUB-SECOND timestamp, then
          # aggregated by WALL CLOCK (not by sample count): a hung upstream produces ONE line per
          # --max-time, so counting samples would let a 10s hole look like a 1s blip.
          #   200      serving
          #   draining this api color got SIGTERM and is finishing its in-flight work; /healthz is 503
          #            by design so Caddy demotes it (services/api/src/lifecycle.ts). NOT an outage -
          #            every other path is still served 200 by this same process. The marker is the
          #            x-civfix-draining RESPONSE HEADER, never the body: the body is world-readable
          #            to anonymous callers and a drain marker in it is a deploy-timing oracle. The
          #            headers are dumped to a file instead of read with curl's %header{} write-out,
          #            which needs curl >= 7.84. A 503 without the header still counts against us.
          #   <code>   any other HTTP status (502 = Caddy has no healthy upstream: a real outage)
          #   000      connection refused / DNS / timeout
          #
          # SLO SEMANTIC: MAX_OUTAGE_S is the longest tolerated GAP between two serving samples - the
          # wall-clock span of a run of consecutive failed samples, including the hop in and out of
          # it. Resolution is the ~1s sample cadence, so an outage shorter than that can fall between
          # two samples and stay invisible: this asserts "no user-visible hole", not "not one dropped
          # request". A single isolated failed sample that returns promptly measures ~2s and passes;
          # 3.0 fails from two consecutive failures upward, and also from one failure slow enough
          # (>~1s of curl time) that the hole itself is real.
          #
          # COVERAGE IS ASSERTED TOO. A worst-gap of 0.00 is what an EMPTY probe.log prints, so the
          # step also records how long it sampled, how many samples it got, how stale the last one
          # is, and whether the sampler was still alive when it was killed. Without that a sampler
          # that died early would report a perfect score for a deploy it never watched.
          rm -f probe.log probe.headers
          probe_started="$(date -u +%s.%N)"
          # errexit off inside the sampler only: a transient curl/grep non-zero must not kill it.
          ( set +e
            while :; do
              t="$(date -u +%s.%N)"
              code="$(curl -s -m 10 -o /dev/null -D probe.headers -w '%{http_code}' "$LIVENESS_URL" 2>/dev/null)"
              state="$code"
              case "$code" in
                200) state=200 ;;
                503) grep -qi '^x-civfix-draining:' probe.headers && state=draining ;;
                ""|000) state=000 ;;
              esac
              printf '%s %s\n' "$t" "$state" >> probe.log
              sleep 1
            done ) &
          PROBE=$!

          # No remote command is passed: the deploy key's forced command runs /opt/civfix/ops/deploy.sh.
          # Its stdout/stderr stream here and its exit code becomes `rc`, which the assertion step
          # turns into a job failure. Keepalives keep the connection up during the (quiet) build.
          if ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "${DEPLOY_USER}@${DEPLOY_HOST}"; then
            rc=0
          else
            rc=$?
          fi

          # deploy.sh returns right after the flip; keep probing across the retiring color's drain and
          # the compose reconcile step.
          sleep 30
          if kill -0 "$PROBE" 2>/dev/null; then probe_alive=1; else probe_alive=0; fi
          kill "$PROBE" 2>/dev/null || true
          wait "$PROBE" 2>/dev/null || true
          probe_ended="$(date -u +%s.%N)"

          echo "--- samples that were not serving (empty is perfect) ---"
          awk '$2!="200" && $2!="draining"' probe.log || true
          total="$(awk 'END { print NR + 0 }' probe.log)"
          # Longest UNAVAILABLE interval in seconds: from the last serving sample before a bad run to
          # the first serving sample after it, so one slow --max-time sample cannot hide the hole.
          worst="$(awk '
            { ok = ($2 == "200" || $2 == "draining")
              if (ok) { if (bad) { d = $1 - lastgood; if (d > worst) worst = d; bad = 0 }; lastgood = $1 }
              else    { if (!bad) { bad = 1; if (lastgood == "") lastgood = $1 }; lastbad = $1 } }
            END { if (bad) { d = lastbad - lastgood; if (d > worst) worst = d }; printf "%.2f", worst + 0 }
          ' probe.log)"
          last="$(tail -n 1 probe.log | awk '{ print $2 }')"
          last_at="$(tail -n 1 probe.log | awk '{ printf "%.2f", $1 + 0 }')"
          elapsed="$(awk -v a="$probe_started" -v b="$probe_ended" 'BEGIN { printf "%.0f", b - a }')"
          stale="$(awk -v e="$probe_ended" -v l="$last_at" 'BEGIN { printf "%.2f", e - l }')"
          echo "samples=$total elapsed_s=$elapsed last_sample=$last last_sample_age_s=$stale probe_alive=$probe_alive longest_unavailable_s=$worst slo=${MAX_OUTAGE_S}s deploy_rc=$rc"
          {
            echo "DEPLOY_RC=$rc"
            echo "WORST_UNAVAILABLE_S=$worst"
            echo "LAST_SAMPLE=$last"
            echo "PROBE_SAMPLES=$total"
            echo "PROBE_ELAPSED_S=$elapsed"
            echo "PROBE_LAST_AGE_S=$stale"
            echo "PROBE_ALIVE=$probe_alive"
          } >> "$GITHUB_ENV"

      - name: Readiness gate (db + redis behind the new api color)
        if: success() || failure()
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code="$(curl -fsS -o /tmp/readyz.json -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "ready: $(cat /tmp/readyz.json)"
              exit 0
            fi
            echo "attempt $i: readyz=$code; retrying in 10s"
            sleep 10
          done
          echo "FATAL: $HEALTH_URL did not return 200 within ~3m after deploy" >&2
          exit 1

      - name: Availability assertion (deploy rc + probe coverage + the API never went down)
        if: success() || failure()
        run: |
          set -euo pipefail
          rc="${DEPLOY_RC:-1}"
          worst="${WORST_UNAVAILABLE_S:-}"
          last="${LAST_SAMPLE:-}"
          samples="${PROBE_SAMPLES:-0}"
          elapsed="${PROBE_ELAPSED_S:-0}"
          age="${PROBE_LAST_AGE_S:-999}"
          alive="${PROBE_ALIVE:-0}"
          [ "$rc" -eq 0 ] || { echo "FATAL: on-box deploy failed (rc=$rc)" >&2; exit 1; }
          # Coverage first: a verdict from a probe that stopped sampling is worthless, and an empty
          # probe.log scores a perfect 0.00.
          [ -n "$worst" ] || { echo "FATAL: the availability probe recorded no verdict" >&2; exit 1; }
          [ "$alive" -eq 1 ] || { echo "FATAL: the availability probe died before the deploy finished" >&2; exit 1; }
          [ "$elapsed" -gt 0 ] || { echo "FATAL: the availability probe measured no time" >&2; exit 1; }
          # At a ~1s cadence with 10s worst-case stalls, fewer than one sample per 3s of deploy means
          # the sampler was not watching.
          awk -v s="$samples" -v e="$elapsed" 'BEGIN { exit !(s >= e / 3) }' || {
            echo "FATAL: availability probe coverage too thin: $samples samples over ${elapsed}s" >&2
            exit 1; }
          awk -v a="$age" 'BEGIN { exit !(a <= 5) }' || {
            echo "FATAL: the last availability sample is ${age}s old; the probe stopped early" >&2
            exit 1; }
          awk -v w="$worst" -v m="$MAX_OUTAGE_S" 'BEGIN { exit !(w <= m) }' || {
            echo "FATAL: public API was unavailable for ~${worst}s during the deploy (slo ${MAX_OUTAGE_S}s)" >&2
            exit 1; }
          case "$last" in
            200|draining) ;;
            *) echo "FATAL: API is not serving at the end of the deploy (last sample: ${last:-none})" >&2; exit 1 ;;
          esac
          echo "availability OK: $samples samples over ${elapsed}s, longest unavailable ${worst}s <= ${MAX_OUTAGE_S}s"

      - name: Cleanup deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
