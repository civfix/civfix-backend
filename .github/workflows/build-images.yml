name: Build release images

# Builds the two artifacts a civfix-backend release consists of (the api and the media-worker) and
# pushes them to GHCR. This is the ONLY place either image is built: the VPS deploy pulls what this
# workflow produced (civfix-infra ops/deploy.sh) instead of rebuilding from source on the box, so
# staging and production run byte-identical bytes rather than two builds of one commit.
# Issue: https://github.com/civfix/issue-tracker/issues/108
#
# THIS WORKFLOW NEVER TRIGGERS ITSELF. It is `workflow_call` only (plus a manual dispatch), and
# deploy-staging.yml calls it on every push to main. Giving it its own `push` trigger would race that
# caller and build every commit twice.
#
# NATIVE ARM64, NOT QEMU. Both VPSes are Oracle Ampere (arm64) boxes. `ubuntu-24.04-arm` is a GitHub
# larger runner (available on the Team plan, billed per-minute rather than from the free allotment) and
# builds ~5-10x faster than cross-building an image with this much native compilation in it: the
# media-worker alone compiles ffmpeg from source and installs sharp/libvips bindings. `platform` is an input so
# a future amd64 box is a one-line change at the call site rather than a rewrite.
#
# TAGGING. The immutable tag is `sha-<full 40-char commit sha>`, and that shape is a CROSS-REPO CONTRACT:
# civfix-infra's ops/deploy.sh reconstructs exactly this tag from the commit it checked out. Do not
# shorten it, do not switch to a `metadata-action` tag scheme, and do not remove it: a deploy that
# cannot find its own release image fails closed and refuses to deploy. `main` is a moving convenience
# tag for humans; nothing reads it.
#
# SUPPLY CHAIN. Each image is pushed untagged, smoke-tested, scanned with Trivy (fixable HIGH and
# CRITICAL fail the run), signed keyless with cosign by digest, and only then tagged. Every published
# `sha-<40>` image therefore passed the scan and carries a signature, an SBOM and max-mode provenance.
#
# Required: nothing. GITHUB_TOKEN with `packages: write` publishes to ghcr.io/civfix/*, the job token's
# OIDC identity signs (`id-token: write`, so a caller must grant it), and
# @civfix/contract installs anonymously from the public-read registry via the committed .npmrc.

on:
  workflow_call:
    inputs:
      platform:
        description: Target platform for the release images.
        type: string
        default: linux/arm64
      runner:
        description: Runner that matches `platform` (native build, no emulation).
        type: string
        default: ubuntu-24.04-arm
    outputs:
      api-digest:
        description: Immutable digest of the api image this run pushed.
        value: ${{ jobs.build.outputs.api-digest }}
      media-worker-digest:
        description: Immutable digest of the media-worker image this run pushed.
        value: ${{ jobs.build.outputs.media-worker-digest }}
      sha:
        description: Commit the images were built from.
        value: ${{ jobs.build.outputs.sha }}
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform for the release images.
        type: string
        default: linux/arm64
      runner:
        description: Runner that matches `platform` (native build, no emulation).
        type: string
        default: ubuntu-24.04-arm

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: api + media-worker (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Pushes the two images to ghcr.io/civfix/*.
      packages: write
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      media-worker-digest: ${{ steps.media-worker.outputs.digest }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the runner really is the target architecture
        # A native build silently becoming an emulated one (a mistyped runner label falling back to
        # x86) would produce images the arm64 boxes cannot run, and the failure would not surface until
        # a deploy on the VPS. Fail here instead.
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$PLATFORM:$arch" in
            linux/arm64:aarch64 | linux/amd64:x86_64) ;;
            *)
              echo "::error::runner arch '$arch' does not match requested platform '$PLATFORM'." >&2
              exit 1
              ;;
          esac
          echo "native build: $PLATFORM on $arch"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      # Both images take the REPO ROOT as their build context: the services are pnpm workspace packages
      # that need the root manifests, pnpm-lock.yaml, .npmrc and packages/ to resolve @civfix/contract.
      # See the header of each Dockerfile.
      #
      # The gha layer cache stays although these are release images: a run on main restores only caches
      # written on main, and the only writer there is this workflow building main's own commits. No PR
      # or merge-queue run can reach that scope.
      #
      # PUSHED BY DIGEST, UNTAGGED. Nothing reads an image until the `publish` job tags it, and that job
      # only runs once both images passed the smoke test and the scan, so an image that fails either
      # never gets the `sha-<40>` tag deploy.sh pulls. The index carries the SBOM and max-mode provenance
      # as attestation manifests; `docker pull` by tag or by the index digest still resolves to the
      # platform image. The SBOM generator runs inside this job, next to its `packages: write` token, so it
      # is pinned by digest rather than left on BuildKit's floating default.
      - name: Build + push api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/api/Dockerfile
          platforms: ${{ inputs.platform }}
          outputs: type=image,name=ghcr.io/civfix/api,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build + push media-worker
        id: media-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/media-worker/Dockerfile
          platforms: ${{ inputs.platform }}
          outputs: type=image,name=ghcr.io/civfix/media-worker,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=media-worker
          cache-to: type=gha,scope=media-worker,mode=max

      - name: Smoke the api image
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
        run: docker run --rm "ghcr.io/civfix/api@${API_DIGEST}" node scripts/image-smoke.mjs

      - name: Scan the api image (fixable HIGH and CRITICAL)
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: trivy image --platform "$PLATFORM" "ghcr.io/civfix/api@${API_DIGEST}"

      - name: Scan the media-worker image (fixable HIGH and CRITICAL)
        env:
          WORKER_DIGEST: ${{ steps.media-worker.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: trivy image --platform "$PLATFORM" "ghcr.io/civfix/media-worker@${WORKER_DIGEST}"

  # Signs, then tags. Kept apart from `build` so the OIDC token that mints a signing certificate is never
  # in a job that runs the Dockerfiles' install scripts.
  publish:
    name: sign + tag (${{ inputs.platform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushes the signatures and adds the tags in ghcr.io/civfix/*.
      packages: write
      # Keyless cosign: the workflow's OIDC identity is what the signing certificate names.
      id-token: write
    env:
      API_DIGEST: ${{ needs.build.outputs.api-digest }}
      WORKER_DIGEST: ${{ needs.build.outputs.media-worker-digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, never by tag: a tag can move between signing and pulling, the digest is the bytes.
      # Signed BEFORE tagging, because a staging deploy that is waiting for this commit pulls the moment
      # the tag appears.
      - name: Sign both images (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/civfix/api@${API_DIGEST}"
          cosign sign --yes "ghcr.io/civfix/media-worker@${WORKER_DIGEST}"

      # The check the boxes are to run before `up` (a civfix-infra follow-up): a signature from this
      # workflow on main (or a release tag), issued to GitHub Actions. A run whose signature would not
      # verify there stops here, untagged.
      - name: Verify the signatures the way a box will
        run: |
          set -euo pipefail
          for ref in "ghcr.io/civfix/api@${API_DIGEST}" "ghcr.io/civfix/media-worker@${WORKER_DIGEST}"; do
            cosign verify \
              --certificate-identity-regexp '^https://github\.com/civfix/civfix-backend/\.github/workflows/build-images\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" > /dev/null
            echo "verified $ref"
          done

      # `imagetools create` from ONE source copies that manifest as-is, so each tag lands on the digest
      # that was scanned and signed; the check below refuses anything else.
      - name: Tag the release images
        run: |
          set -euo pipefail
          for pair in "api:${API_DIGEST}" "media-worker:${WORKER_DIGEST}"; do
            image="${pair%%:*}"
            digest="${pair#*:}"
            repo="ghcr.io/civfix/$image"
            docker buildx imagetools create --tag "$repo:sha-${GITHUB_SHA}" --tag "$repo:main" "$repo@$digest"
            tagged="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$repo:sha-${GITHUB_SHA}")"
            [ "$tagged" = "$digest" ] || {
              echo "::error::$repo:sha-${GITHUB_SHA} points at $tagged, not the scanned and signed $digest." >&2
              exit 1
            }
          done

      - name: Summary
        run: |
          {
            echo "### Release images"
            echo
            echo "Commit \`${GITHUB_SHA}\` (scanned, signed, tagged \`sha-${GITHUB_SHA}\`)"
            echo
            echo "| image | digest |"
            echo "| --- | --- |"
            echo "| \`ghcr.io/civfix/api\` | \`${API_DIGEST}\` |"
            echo "| \`ghcr.io/civfix/media-worker\` | \`${WORKER_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
