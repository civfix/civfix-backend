# SOPS configuration placeholder.
#
# Fill in real age recipients before encrypting anything. The creation_rules below map encrypted
# files in this directory to the age public keys allowed to decrypt them. Do NOT put private keys
# here; only the public `age1...` recipients.
#
# Example (replace the placeholder recipient with your real age public key):

creation_rules:
  - path_regex: infra/secrets/.*\.env$
    # age: comma-separated list of age1... public recipients (operators + CI).
    age: >-
      age1placeholderreplace0000000000000000000000000000000000000000000
