# Custom postgres_exporter queries for civfix. The `monitoring` role has SELECT on abuse_flags only
# (plus pg_monitor for built-in stats). Metric names are <query-key>_<column>, e.g.
# civfix_abuse_flags_open -> civfix_abuse_flags_open_count.
#
# abuse_flags columns: subject_type, subject_id, reason (nsfw|phash_dup|honeypot|gps|manual|other),
# source (worker|api|user_report), created_at, resolved_at (NULL = open).

civfix_abuse_flags_open:
  query: >-
    SELECT reason, source, count(*)::float8 AS count
    FROM abuse_flags
    WHERE resolved_at IS NULL
    GROUP BY reason, source
  metrics:
    - reason:
        usage: "LABEL"
        description: "Abuse reason"
    - source:
        usage: "LABEL"
        description: "Who/what raised the flag"
    - count:
        usage: "GAUGE"
        description: "Open (unresolved) abuse flags"

civfix_abuse_flags_recent:
  query: >-
    SELECT reason, count(*)::float8 AS count
    FROM abuse_flags
    WHERE created_at > now() - interval '15 minutes'
    GROUP BY reason
  metrics:
    - reason:
        usage: "LABEL"
        description: "Abuse reason"
    - count:
        usage: "GAUGE"
        description: "Abuse flags raised in the trailing 15 minutes"

civfix_abuse_flags_total:
  query: >-
    SELECT reason, source, count(*)::float8 AS count
    FROM abuse_flags
    GROUP BY reason, source
  metrics:
    - reason:
        usage: "LABEL"
        description: "Abuse reason"
    - source:
        usage: "LABEL"
        description: "Who/what raised the flag"
    - count:
        usage: "GAUGE"
        description: "All-time abuse flags by reason/source"
