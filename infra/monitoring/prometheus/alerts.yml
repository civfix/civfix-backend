# civfix alert rules. Delivery is intentionally NOT wired (no Alertmanager): rules evaluate and surface
# as the ALERTS series, shown by Grafana's "Active alerts" panel. To enable paging later, add an
# `alertmanagers:` block to prometheus.yml (or migrate these to Grafana-managed contact points).
#
# Thresholds are deliberate starting points for a young product; tune in-place as real baselines emerge.
groups:
  - name: availability
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been unscrapeable for 2m."

      - alert: CoreContainerMissing
        # Best-effort liveness for the critical app containers via cAdvisor's last-seen timestamp.
        expr: time() - max by (name) (container_last_seen{name=~"compose-(api|postgres|redis|caddy)-1"}) > 120
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Core container {{ $labels.name }} not seen for >2m"
          description: "cAdvisor stopped reporting {{ $labels.name }}; it may have crashed or been removed."

  - name: host-resources
    rules:
      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host available memory < 10%"
          description: "Only {{ $value | humanizePercentage }} of RAM available for 5m."

      - alert: HostDiskFillingUp
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Root filesystem < 15% free"
          description: "Root fs has {{ $value | humanizePercentage }} space free. Check Prometheus/Loki retention and Docker build cache."

      - alert: HostDiskCritical
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Root filesystem < 5% free"
          description: "Root fs critically low ({{ $value | humanizePercentage }} free)."

      - alert: HostHighCPU
        expr: 1 - avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU > 90% busy"
          description: "CPU has averaged >90% busy for 15m ({{ $value | humanizePercentage }})."

  - name: datastores
    rules:
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres connections > 80% of max"
          description: "{{ $value | humanizePercentage }} of max_connections in use for 5m."

      - alert: RedisMemoryHigh
        # Redis runs with maxmemory 768MB + allkeys-lru, so used_memory caps there; alert on the ratio
        # (guard against maxmemory being unset → no false-positive from divide-by-zero).
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) > 0.90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis memory > 90% of maxmemory"
          description: "Redis at {{ $value | humanizePercentage }} of maxmemory; eviction imminent."

      - alert: RedisEvictingKeys
        # The real memory-pressure signal once at maxmemory: keys being evicted (sessions / rate-limit
        # state can be dropped). RedisMemoryHigh may not fire because eviction holds used_memory at the cap.
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis is evicting keys"
          description: "Redis hit maxmemory and is evicting ~{{ $value | humanize }} keys/s."

  - name: abuse
    rules:
      - alert: AbuseSurge
        # Sum across reasons of flags raised in the trailing 15m window (custom postgres_exporter query).
        expr: sum(civfix_abuse_flags_recent_count) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Abuse-flag surge: {{ $value }} flags in 15m"
          description: "Unusual volume of abuse flags. Inspect by reason on the civfix Overview dashboard."

      - alert: NsfwSpike
        expr: sum(civfix_abuse_flags_recent_count{reason="nsfw"}) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "NSFW-flag spike: {{ $value }} in 15m"
          description: "Elevated NSFW media flags from the media worker."
