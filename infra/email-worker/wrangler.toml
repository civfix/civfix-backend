# Cloudflare Email Worker for catch-all *@civfix.org inbound mail.
#
# This Worker is NOT part of the pnpm/Turbo workspace (pnpm-workspace.yaml globs services/* and
# packages/*, not infra/*). It has its own wrangler toolchain. See README.md.
#
# NOTE: the catch-all -> Worker route and the Email Routing enablement are configured in the Cloudflare
# dashboard/API, NOT here. The shared secret is a Worker secret (wrangler secret put), NOT a var.

name = "civfix-inbound-email"
main = "src/index.ts"
compatibility_date = "2025-06-01"   # pinned; bump deliberately
# nodejs_compat is NOT needed: only WebCrypto + fetch + R2 are used.

# Bind the inbound-mail bucket. The code references env.R2_BUCKET; bucket_name is the real R2 bucket the
# backend ALSO reads (set the backend's R2_INBOUND_BUCKET to this same name) so its sweep over
# inbound/pending/ sees what this Worker writes.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "civfix-emails"   # dedicated inbound bucket; backend reads it via R2_INBOUND_BUCKET

[vars]
BACKEND_WEBHOOK_URL = "https://api.civfix.org/webhooks/inbound-mail"   # must equal PUBLIC_API_URL + /webhooks/inbound-mail

# Email Routing routes to ONE deployed worker, so each environment needs a distinct name.
[env.production]
name = "civfix-inbound-email"
[env.production.vars]
BACKEND_WEBHOOK_URL = "https://api.civfix.org/webhooks/inbound-mail"
[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "civfix-emails"

[env.staging]
name = "civfix-inbound-email-staging"
[env.staging.vars]
BACKEND_WEBHOOK_URL = "https://api.civfix.dev/webhooks/inbound-mail"
[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "civfix-emails-staging"
