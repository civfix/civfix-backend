# Local dev infrastructure ONLY: a PostGIS-enabled Postgres and a Redis, for running migrations and
# integration tests against real services on your machine. Do NOT run this from the scaffold step.
#
# Usage (later, once Docker is available):
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
#   export DATABASE_URL=postgres://civfix:civfix@localhost:5432/civfix
#   export REDIS_URL=redis://localhost:6379
#
# DEV-ONLY API PORT OVERRIDE: the production compose (docker-compose.yml) does NOT host-publish the API
# (only Caddy is public; the API is internal-only). When this override is layered ON TOP of it for a fully
# local stack, e.g.
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml up
# the `api` stanza below merges in a loopback-only host port (127.0.0.1:8080) so you can curl the API
# directly without going through Caddy. This binding is DEV-ONLY: it bypasses Caddy's forwarding-header
# strip, so it must never appear in the production compose. Bound to 127.0.0.1 (not 0.0.0.0) so it is not
# reachable off the dev box. Harmless when this file is run standalone (the `api` service is not defined
# there, so the extra keys simply have nothing to attach to).

services:
  # Merges into the production `api` service ONLY when both files are passed to `docker compose`.
  # Adds a loopback-only host port for local debugging. See the DEV-ONLY note in the header above.
  api:
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: civfix
      POSTGRES_PASSWORD: civfix
      POSTGRES_DB: civfix
    # SECURITY: bind to loopback only (mirrors the api port above) so the dev datastore is not reachable
    # off the dev box — a 0.0.0.0 bind with the well-known civfix/civfix creds exposes it to the LAN / a
    # routable cloud-VM IP. localhost (127.0.0.1) still satisfies the documented DATABASE_URL.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civfix -d civfix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    # SECURITY: loopback-only bind (dev datastore must not be exposed off the box). Dev redis stays
    # passwordless for STANDALONE local dev (the documented `up -d` + REDIS_URL=redis://localhost:6379).
    # CAVEAT: layering this file on docker-compose.yml (`-f docker-compose.yml -f docker-compose.dev.yml`)
    # makes THIS passwordless command win over the prod redis's --requirepass, so the layered stack runs an
    # UNAUTHENTICATED redis. Do NOT use the layered combo to validate the prod auth setup — to exercise
    # prod redis auth, run the prod compose alone with REDIS_PASSWORD set (and the matching REDIS_URL).
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pg-dev-data:
