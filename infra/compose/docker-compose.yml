# civfix production-ish compose. Reference for deployment (not run from the scaffold step).
#
# POSTGRES is EXTERNAL (a managed PostGIS-enabled Postgres): set DATABASE_URL in the env files. REDIS is
# provided here as a local service by default; to use a managed Redis instead, set REDIS_URL in the env
# files and delete the `redis` service + its `depends_on` references. For a fully local stack (Postgres
# too), run infra/compose/docker-compose.dev.yml alongside this file.
#
# BUILD: every image's build context is the REPO ROOT (../.. from infra/compose) because the services are
# pnpm-workspace packages that need the root manifests + lockfile + shared/ submodule in the context (see
# each service's Dockerfile header). `docker compose build` works from this file unchanged.
#
# DEPLOY SEQUENCE (enforced by depends_on conditions): migrate -> seed -> api  (the green-by-default path).
#   1) `migrate` runs once (node dist/db/migrate.js): applies the drizzle SQL in order, idempotently, then
#      exits 0. It reuses the API image (which carries the runner + the drizzle SQL).
#   2) `seed` runs once AFTER migrate (node dist/db/seed.js): populates the jurisdictions table with the
#      curated dev/federal/tribal sample so the spatial resolver returns SOMETHING out of the box. It is
#      idempotent (ON CONFLICT DO NOTHING). This keeps the stack BOOTABLE on a fresh box with no external
#      boundary data staged — without a populated table the resolver returns null for every pin
#      (jurisdiction_geoid = NULL -> "Unmapped") and the admin Jurisdictions directory reads empty.
#   3) `api` starts only AFTER seed completes successfully AND redis is healthy (a seed failure blocks the
#      API LOUDLY rather than serving an empty-jurisdiction backend silently). `media-worker` gates on
#      migrate only (it processes bytes, independent of jurisdiction data).
# Re-running `docker compose up` re-runs migrate + seed; both are no-ops when already applied.
#
# PRODUCTION upgrade to REAL boundaries (migrate -> ingest -> backfill -> api): once whole-US TIGER/PAD-US
# GeoJSON is staged on a host volume at /data/boundaries (produce it with `pnpm db:prepare-boundaries`; see
# documents/20-jurisdiction-mapping.md §13), swap `seed` for the commented `ingest` + `backfill` services
# below and repoint `api.depends_on` at `backfill`. Do NOT enable them before the data is mounted: `ingest`
# reads its input file at startup and exits non-zero if it is missing, which (via
# service_completed_successfully) would block the WHOLE stack from starting.
#
# EXPOSURE: ONLY `caddy` is host-published (80/443). `api` and `media-worker` are reachable solely on the
# internal compose network; Caddy proxies to the API by service name (api:8080). This keeps every API
# request flowing through Caddy, which strips client-supplied forwarding headers (X-Forwarded-* / CF-*),
# so the trust-proxy default (trust only internal hops) holds and a forged X-Forwarded-For can never reach
# the API from a direct public hit. For a local-dev direct port on the API, use docker-compose.dev.yml.
#
# Resource limits follow the capacity plan: api 1.5G / 2 cpu, media-worker 2.5G / 1.5 cpu, redis 1G.
# mem_limit/cpus are Compose v2 (non-swarm) keys.

services:
  # One-shot schema migration. Gate for api + worker. Exits 0 on success (restart: "no").
  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: "no"
    env_file:
      - ../secrets/api.env
    # Override the API server CMD: run the migration runner from the built dist (no tsx in the prod image).
    command: ["node", "dist/db/migrate.js"]
    # Migrations target the EXTERNAL Postgres (DATABASE_URL); they do not need redis.

  # One-shot jurisdiction seed (runs AFTER migrate, gates api). Reuses the API image. Loads the curated
  # 6-feature dev/federal/tribal sample (node dist/db/seed.js) so the resolver works out of the box on a
  # fresh deploy with NO external boundary data staged. Idempotent (ON CONFLICT DO NOTHING), so re-running
  # `docker compose up` is a no-op. For REAL nationwide coverage, stage the boundary GeoJSON and switch to
  # the commented `ingest` + `backfill` services below (see the PRODUCTION note in the header + the runbook
  # in documents/20-jurisdiction-mapping.md §13).
  seed:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: "no"
    env_file:
      - ../secrets/api.env
    command: ["node", "dist/db/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Seeding targets the EXTERNAL Postgres (DATABASE_URL); it does not need redis.

  # ---------------------------------------------------------------------------------------------------
  # PRODUCTION (real boundaries) — OPT-IN, commented out. Enable ONLY after the whole-US boundary GeoJSON
  # is staged on a host volume at /data/boundaries (TIGER states/counties/places + Census AIANNH + USGS
  # PAD-US federal; produce it with `pnpm db:prepare-boundaries`, see documents/20-jurisdiction-mapping.md
  # §13). To switch: comment out the `seed` service above, uncomment both services below, and repoint
  # `api.depends_on` from `seed` to `backfill`. Each service reads its input at startup and exits non-zero
  # if the file is missing, so NEVER enable these without the data mounted (it would block the whole stack).
  #
  # `ingest` loads REAL boundary data (idempotent upsert by geoid; refreshes geometry/name, PRESERVES
  # operator-mapped contacts). The command is a single-file TEMPLATE — a real deploy runs ONE ingest per
  # layer (use an entrypoint loop or one `ingest-<layer>` service per file chaining via depends_on), with
  # the optional 3rd `geoid-prefix` arg for the non-FIPS layers:
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/states.geojson","state"]
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/counties.geojson","county"]
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/places_<SS>.geojson","place"]  # per state
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/aiannh.geojson","tribal","AIANNH-"]
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/federal.geojson","federal","PADUS-"]
  # The AIANNH-/PADUS- prefixes keep those geoids globally unique (no PK collision with a 5-char county
  # geoid) and make the geocoder fall back to a spatial state query instead of a bogus FIPS shortcut.
  # ingest:
  #   build:
  #     context: ../..
  #     dockerfile: services/api/Dockerfile
  #   image: civfix/api:latest
  #   restart: "no"
  #   env_file:
  #     - ../secrets/api.env
  #   command: ["node", "dist/db/ingest-jurisdictions.js", "/data/boundaries/places.geojson", "place"]
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #   volumes:
  #     - /srv/civfix/boundaries:/data/boundaries:ro
  #
  # `backfill` re-resolves reports.jurisdiction_geoid for rows still NULL (the "Unmapped" backlog) using the
  # SAME canonical layer ranking as the write-time resolver. Resolution happens once at insert time, so
  # reports inserted before coverage existed do NOT self-heal — this sweep clears them. Idempotent (WHERE
  # jurisdiction_geoid IS NULL). NOTE: only `reports` is backfilled; the `cleanups` table has no
  # jurisdiction_geoid column (Design B would add one).
  # backfill:
  #   build:
  #     context: ../..
  #     dockerfile: services/api/Dockerfile
  #   image: civfix/api:latest
  #   restart: "no"
  #   env_file:
  #     - ../secrets/api.env
  #   command: ["node", "dist/db/backfill-jurisdictions.js"]
  #   depends_on:
  #     ingest:
  #       condition: service_completed_successfully
  # ---------------------------------------------------------------------------------------------------

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: unless-stopped
    env_file:
      # Prefer a SOPS-decrypted file mounted at deploy time; fall back to a local .env.
      - ../secrets/api.env
    # NODE_ENV is owned by the DEPLOYMENT, never the secrets file. Compose `environment` overrides any
    # value in `env_file` (and the Dockerfile's `ENV NODE_ENV=production`), so a secrets file copied from
    # .env.example (which ships NODE_ENV=development for local dev) can NEVER silently demote the API to
    # dev mode. That demotion is exactly what breaks the operator dashboard: in dev mode env.ts does not
    # require DATABASE_URL/REDIS_URL, so the auth bundle is not built and registerRoutes skips BOTH the
    # citizen /auth/* and the operator /admin/* routes -> every such request 404s ("Route GET
    # /admin/auth/session not found") while /healthz still passes. Forcing production here makes env.ts
    # REQUIRE the real infra (DB/Redis/signing keys/creds): the API either boots correctly or fails
    # loudly listing the missing vars, instead of silently serving an all-fakes backend.
    environment:
      NODE_ENV: production
    # NOT host-published: the API is reachable only on the internal compose network. Caddy proxies to it
    # by service name (api:8080), so every request passes the edge header-strip. For a local-dev direct
    # port, use docker-compose.dev.yml (dev-only). Containers on this network reach it via `api:8080`.
    expose:
      - "8080"
    depends_on:
      # Gate on `seed` so the API never serves an empty-jurisdiction backend: a seed failure blocks the API
      # loudly instead of silently breaking resolution + the admin Jurisdictions directory. For the
      # PRODUCTION real-boundary path, repoint this to `backfill` (see the header + the commented services).
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2.0
    # SECURITY: defense-in-depth container hardening. The app needs no Linux capabilities and never
    # escalates privileges, so drop everything and forbid setuid escalation.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512
    healthcheck:
      # GET /healthz is pure (no DB/Redis). Node 22 global fetch -> no curl needed in the slim image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  media-worker:
    # NOT host-published either: a background job worker with no inbound HTTP, reachable only on the
    # internal compose network. No `ports:`/`expose:` mapping (nothing to serve to the host).
    build:
      context: ../..
      dockerfile: services/media-worker/Dockerfile
    image: civfix/media-worker:latest
    restart: unless-stopped
    env_file:
      - ../secrets/media-worker.env
    # Same rationale as the API: force production so a copied secrets file cannot demote the worker to
    # dev mode, where seams.ts/jobs.ts default every USE_FAKE_* ON and the untrusted-byte pipeline would
    # silently run FAKE NSFW/abuse + dup checks and FAKE storage in production (a security gap). In
    # production the real R2/abuse adapters are required (or explicitly toggled via USE_FAKE_* in the
    # secrets file), and a missing DATABASE_URL fails the worker loudly.
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 2560m
    cpus: 1.5
    # SECURITY: this is the HIGHEST-risk container — it decodes fully attacker-controlled media bytes via
    # native code (sharp/libvips + ffmpeg). Harden it the most: drop all caps, forbid privilege escalation,
    # make the root filesystem read-only, and give it ONLY a writable tmpfs at /tmp (where the sandbox
    # stages bytes via mkdtemp — see sandbox/tmp.ts). pids_limit bounds a fork-bomb from a popped ffmpeg
    # child. If a future code path needs to write outside /tmp, add an explicit named volume rather than
    # dropping read_only.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512

  redis:
    # SECURITY: pin a PATCHED tag (not the floating `redis:7`) so a deploy can't pull an image still
    # vulnerable to the Lua-scripting RCE class (CVE-2025-49844 "RediShell", CVE-2024-31449,
    # CVE-2025-46817). 7.4.9 includes the fixes and matches the currently-deployed build (no downgrade).
    image: redis:7.4.9
    restart: unless-stopped
    # SECURITY: require a password. Redis is only on the internal compose network (no host port), but an
    # unauthenticated Redis reachable from any compromised container (e.g. a worker popped via a native
    # media-decode bug) is a direct data + Lua-RCE pivot. The password comes from a dedicated SOPS-encrypted
    # secret (redis.env, decrypted into ../secrets by ops/deploy.sh) so it is NOT shared with any other
    # service's env. The api/worker REDIS_URL MUST embed the same value: redis://:<REDIS_PASSWORD>@redis:6379.
    env_file:
      - ../secrets/redis.env
    # `$$` escapes Compose interpolation so the CONTAINER shell expands $REDIS_PASSWORD from the env_file
    # (a single `$` would be substituted by Compose at parse time, from the host env, instead).
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 768mb --maxmemory-policy allkeys-lru --save ""',
      ]
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticated ping (PING returns NOAUTH without -a once requirepass is set). `$$` so the container
      # shell expands the password from the env_file, not Compose at parse time.
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
