# civfix production-ish compose. Reference for deployment (not run from the scaffold step).
#
# POSTGRES is EXTERNAL (a managed PostGIS-enabled Postgres): set DATABASE_URL in the env files. REDIS is
# provided here as a local service by default; to use a managed Redis instead, set REDIS_URL in the env
# files and delete the `redis` service + its `depends_on` references. For a fully local stack (Postgres
# too), run infra/compose/docker-compose.dev.yml alongside this file.
#
# BUILD: every image's build context is the REPO ROOT (../.. from infra/compose) because the services are
# pnpm-workspace packages that need the root manifests + lockfile + shared/ submodule in the context (see
# each service's Dockerfile header). `docker compose build` works from this file unchanged.
#
# DEPLOY SEQUENCE (enforced by depends_on conditions): migrate -> ingest -> backfill -> api.
#   1) `migrate` runs once (node dist/db/migrate.js): applies drizzle/0000..0005 in order, idempotently,
#      then exits 0. It reuses the API image (which carries the runner + the drizzle SQL).
#   2) `ingest` runs once AFTER migrate (node dist/db/ingest-jurisdictions.js <file> <layer> [prefix]):
#      loads REAL boundary data (TIGER states/counties/places + Census AIANNH + USGS PAD-US federal) into
#      the jurisdictions table. WITHOUT coverage the table is empty, the spatial resolver returns null for
#      every pin (jurisdiction_geoid = NULL -> everything "Unmapped"), and the admin Jurisdictions
#      directory reads empty. Idempotent (ON CONFLICT), so re-runs refresh geometry/name and PRESERVE
#      operator-mapped contacts. The command below is a TEMPLATE (one example file); real deployments run
#      one ingest per layer over volume-mounted /data/boundaries/*.geojson — see the service comment.
#   3) `backfill` runs once AFTER ingest (node dist/db/backfill-jurisdictions.js): re-resolves
#      reports.jurisdiction_geoid for rows that are still NULL (the existing "Unmapped" backlog).
#      Resolution happens ONCE at write time, so reports inserted before coverage existed do NOT self-heal
#      — this one-off sweep clears them. Idempotent (WHERE jurisdiction_geoid IS NULL). NOTE: only `reports`
#      is backfilled; the `cleanups` table has NO jurisdiction_geoid column (adding one + a write-time
#      resolver is Design B, out of scope here).
#   4) `api` starts only AFTER backfill completes successfully AND redis is healthy (so an ingest/backfill
#      failure blocks the API LOUDLY rather than serving an empty-jurisdiction backend silently).
#      `media-worker` gates on migrate only (it processes bytes, independent of jurisdiction data).
# Re-running `docker compose up` re-runs migrate + ingest + backfill; all three are no-ops/idempotent when
# already applied (migrate skips applied SQL, ingest upserts by geoid, backfill only touches NULL rows).
#
# EXPOSURE: ONLY `caddy` is host-published (80/443). `api` and `media-worker` are reachable solely on the
# internal compose network; Caddy proxies to the API by service name (api:8080). This keeps every API
# request flowing through Caddy, which strips client-supplied forwarding headers (X-Forwarded-* / CF-*),
# so the trust-proxy default (trust only internal hops) holds and a forged X-Forwarded-For can never reach
# the API from a direct public hit. For a local-dev direct port on the API, use docker-compose.dev.yml.
#
# Resource limits follow the capacity plan: api 1.5G / 2 cpu, media-worker 2.5G / 1.5 cpu, redis 1G.
# mem_limit/cpus are Compose v2 (non-swarm) keys.

services:
  # One-shot schema migration. Gate for api + worker. Exits 0 on success (restart: "no").
  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: "no"
    env_file:
      - ../secrets/api.env
    # Override the API server CMD: run the migration runner from the built dist (no tsx in the prod image).
    command: ["node", "dist/db/migrate.js"]
    # Migrations target the EXTERNAL Postgres (DATABASE_URL); they do not need redis.

  # One-shot REAL-boundary ingest (runs AFTER migrate, gates backfill -> api). Reuses the API image.
  # Idempotent (ON CONFLICT upsert by geoid), so re-running `docker compose up` refreshes geometry/name and
  # PRESERVES operator-mapped contacts. Without coverage the jurisdictions table is empty -> the resolver
  # returns null for every pin -> the admin Jurisdictions directory is empty and everything buckets as
  # "Unmapped".
  #
  # The `command` below is a single-file TEMPLATE. Real deployments run ONE ingest per layer over the
  # volume-mounted boundary GeoJSON, with the optional 3rd `geoid-prefix` arg for the non-FIPS layers:
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/states.geojson","state"]
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/counties.geojson","county"]
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/places_<SS>.geojson","place"]  # per state
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/aiannh.geojson","tribal","AIANNH-"]
  #   ["node","dist/db/ingest-jurisdictions.js","/data/boundaries/federal.geojson","federal","PADUS-"]
  # The AIANNH-/PADUS- prefixes keep those geoids globally unique (no PK collision with a 5-char county
  # geoid) and make the geocoder fall back to a spatial state query instead of a bogus FIPS shortcut.
  #
  # The real boundary GeoJSON is LARGE and EXTERNAL (whole-US TIGER + GB-scale PAD-US); it is NOT baked
  # into the image. Mount it from a host volume or object storage at /data/boundaries (see the runbook in
  # documents/20-jurisdiction-mapping.md §13). To orchestrate several per-layer ingests, either run an
  # entrypoint script that loops the files, or define one `ingest-<layer>` service per file chaining via
  # depends_on (each restart: "no", gating the next). The single-file form here is the minimal template.
  ingest:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: "no"
    env_file:
      - ../secrets/api.env
    # TEMPLATE: one example layer. Replace/extend per the per-layer list above for a real deployment.
    command: ["node", "dist/db/ingest-jurisdictions.js", "/data/boundaries/places.geojson", "place"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Ingest targets the EXTERNAL Postgres (DATABASE_URL); it does not need redis. Mount the boundary data:
    # volumes:
    #   - /srv/civfix/boundaries:/data/boundaries:ro

  # One-shot backfill (runs AFTER ingest, gates api). Reuses the API image. Re-resolves
  # reports.jurisdiction_geoid for rows still NULL (the "Unmapped" backlog) using the SAME canonical layer
  # ranking the write-time resolver uses. Resolution happens once at insert time, so reports inserted
  # before coverage existed do NOT self-heal — this sweep clears them. Idempotent (WHERE
  # jurisdiction_geoid IS NULL), so re-runs are no-ops. NOTE: only `reports` is backfilled; the `cleanups`
  # table has no jurisdiction_geoid column (Design B would add one).
  backfill:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: "no"
    env_file:
      - ../secrets/api.env
    command: ["node", "dist/db/backfill-jurisdictions.js"]
    depends_on:
      ingest:
        condition: service_completed_successfully
    # Backfill targets the EXTERNAL Postgres (DATABASE_URL); it does not need redis.

  # LOCAL-DEV FALLBACK (commented out). The curated 6-feature dev/federal/tribal sample seed — useful for
  # a local stack with no real boundary GeoJSON mounted. To use it instead of the real `ingest` above:
  # comment out the `ingest` service, uncomment this `seed`, and point the `backfill` + `api` depends_on at
  # `seed` instead of `ingest`. It is idempotent (ON CONFLICT DO NOTHING).
  # seed:
  #   build:
  #     context: ../..
  #     dockerfile: services/api/Dockerfile
  #   image: civfix/api:latest
  #   restart: "no"
  #   env_file:
  #     - ../secrets/api.env
  #   command: ["node", "dist/db/seed.js"]
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: civfix/api:latest
    restart: unless-stopped
    env_file:
      # Prefer a SOPS-decrypted file mounted at deploy time; fall back to a local .env.
      - ../secrets/api.env
    # NODE_ENV is owned by the DEPLOYMENT, never the secrets file. Compose `environment` overrides any
    # value in `env_file` (and the Dockerfile's `ENV NODE_ENV=production`), so a secrets file copied from
    # .env.example (which ships NODE_ENV=development for local dev) can NEVER silently demote the API to
    # dev mode. That demotion is exactly what breaks the operator dashboard: in dev mode env.ts does not
    # require DATABASE_URL/REDIS_URL, so the auth bundle is not built and registerRoutes skips BOTH the
    # citizen /auth/* and the operator /admin/* routes -> every such request 404s ("Route GET
    # /admin/auth/session not found") while /healthz still passes. Forcing production here makes env.ts
    # REQUIRE the real infra (DB/Redis/signing keys/creds): the API either boots correctly or fails
    # loudly listing the missing vars, instead of silently serving an all-fakes backend.
    environment:
      NODE_ENV: production
    # NOT host-published: the API is reachable only on the internal compose network. Caddy proxies to it
    # by service name (api:8080), so every request passes the edge header-strip. For a local-dev direct
    # port, use docker-compose.dev.yml (dev-only). Containers on this network reach it via `api:8080`.
    expose:
      - "8080"
    depends_on:
      # Gate on `backfill` (which chains migrate -> ingest -> backfill) so the API never serves an
      # empty-jurisdiction backend: an ingest/backfill failure blocks the API loudly instead of silently
      # breaking resolution + the admin Jurisdictions directory + leaving the "Unmapped" backlog unresolved.
      backfill:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      # GET /healthz is pure (no DB/Redis). Node 22 global fetch -> no curl needed in the slim image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  media-worker:
    # NOT host-published either: a background job worker with no inbound HTTP, reachable only on the
    # internal compose network. No `ports:`/`expose:` mapping (nothing to serve to the host).
    build:
      context: ../..
      dockerfile: services/media-worker/Dockerfile
    image: civfix/media-worker:latest
    restart: unless-stopped
    env_file:
      - ../secrets/media-worker.env
    # Same rationale as the API: force production so a copied secrets file cannot demote the worker to
    # dev mode, where seams.ts/jobs.ts default every USE_FAKE_* ON and the untrusted-byte pipeline would
    # silently run FAKE NSFW/abuse + dup checks and FAKE storage in production (a security gap). In
    # production the real R2/abuse adapters are required (or explicitly toggled via USE_FAKE_* in the
    # secrets file), and a missing DATABASE_URL fails the worker loudly.
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 2560m
    cpus: 1.5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "768mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 1024m
    cpus: 1.0
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
