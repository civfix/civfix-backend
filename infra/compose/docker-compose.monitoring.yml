# civfix monitoring stack — overlaid onto the same `compose` project as the app
# (docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml ...).
# Joining the project's default network lets these reach api:8080 / postgres:5432 / redis:6379 / caddy
# by name exactly as the app services do, and lets the existing Caddy reverse_proxy to grafana:3000.
#
# Invariants (do not weaken):
#  - NOTHING here publishes a host port. The only public ingress remains Caddy:443 (CF-IP-locked).
#    Grafana is reached only via Caddy -> monitor.civfix.org. Everything else is scrape-internal.
#  - Pinned image tags (supply chain). Every container is mem-capped so monitoring can't starve the app.
#  - no-new-privileges everywhere; caps dropped / rootfs read-only where the image allows.
#  - The Docker socket is touched ONLY by the read-only socket-proxy; Alloy talks to it over TCP.

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=15GB
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../monitoring/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    # The grafana/alloy image runs as root and needs the default Docker cap set (incl. DAC_OVERRIDE)
    # to manage its WAL/positions dir; we don't drop caps here. Still contained: no host ports, logs are
    # read via the read-only socket-proxy (never the raw docker.sock), and no-new-privileges is enforced.
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - loki
      - socket-proxy

  # Read-only Docker API gateway. Alloy discovers containers and streams their logs through THIS,
  # never the raw socket. POST/mutating endpoints are denied; only container metadata + logs are GET-able.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # GET /containers and /containers/{id}/logs (what Alloy needs)
      NETWORKS: "1"     # GET /networks — Alloy's discovery.docker computes network labels (read-only)
      VERSION: "1"      # API version negotiation
      PING: "1"
      POST: "0"         # deny all mutating calls
      IMAGES: "0"
      VOLUMES: "0"
      INFO: "0"
      EXEC: "0"
      NODES: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      SYSTEM: "0"
      DISTRIBUTION: "0"
      BUILD: "0"
      COMMIT: "0"
      PLUGINS: "0"
      AUTH: "0"
      SESSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run/credentials/.+|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    mem_limit: 128m
    pid: host
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,resctrl,cpu_topology
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    user: "65534:65534"
    env_file:
      - ../secrets/monitoring.env   # DATA_SOURCE_NAME for the least-priv `monitoring` role
    environment:
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ../monitoring/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    user: "59000:59000"
    environment:
      REDIS_ADDR: redis://redis:6379
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    depends_on:
      - redis

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    env_file:
      - ../secrets/grafana.env       # GF_SECURITY_ADMIN_USER / _PASSWORD (SOPS)
    environment:
      GF_SERVER_ROOT_URL: https://monitor.civfix.org
      GF_SERVER_DOMAIN: monitor.civfix.org
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_X_XSS_PROTECTION: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
